<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23467A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Receipt Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one ledger column (max 980px) — sticky tab bar, scan queue as cards, journal as ruled table. Indigo (藍) for action, vermilion (朱) only for the 印 stamp + warnings. */
:root{
  --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#18212C; --muted:#5A6676; --rule:#D3DAE2; --rule-strong:#AEB9C6;
  --ai:#23467A; --ai-soft:#E3EAF4; --shu:#C2412A; --shu-soft:#F7E6E2; --ok:#2A7A57; --ok-soft:#E1F1E9; --warn:#9A6A0B; --warn-soft:#F6EED9;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151B; --sheet:#19202A; --ink:#E4E9F0; --muted:#94A1B2; --rule:#2B3440; --rule-strong:#44505F;
  --ai:#86AAE2; --ai-soft:#1E2B3E; --shu:#E9806A; --shu-soft:#3A2420; --ok:#62C495; --ok-soft:#18332A; --warn:#E3B65A; --warn-soft:#33291A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151B; --sheet:#19202A; --ink:#E4E9F0; --muted:#94A1B2; --rule:#2B3440; --rule-strong:#44505F;
  --ai:#86AAE2; --ai-soft:#1E2B3E; --shu:#E9806A; --shu-soft:#3A2420; --ok:#62C495; --ok-soft:#18332A; --warn:#E3B65A; --warn-soft:#33291A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
.eyebrow{font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:.82rem}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.stamp{width:44px;height:44px;border:2px solid var(--shu);color:var(--shu);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;transform:rotate(-8deg);flex:none}
.yearpick{display:flex;align-items:center;gap:8px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:4px;margin-block:18px 16px;border-bottom:1px solid var(--rule-strong);overflow-x:auto}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ai)}
nav.tabs button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}

.banner{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}
.banner.err{border-color:var(--shu);background:var(--shu-soft)}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{appearance:none;font:inherit;font-weight:500;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink);border-radius:var(--r);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--ai)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.drop:focus-within{outline:2px solid var(--ai);outline-offset:2px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--sheet)}
.btn.danger{color:var(--shu);border-color:var(--shu)}
.btn.ghost{border-color:transparent;background:none;color:var(--ai)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:2px dashed var(--rule-strong);border-radius:var(--r);padding:28px 16px;background:var(--sheet);cursor:pointer}
.drop.over{border-color:var(--ai);background:var(--ai-soft)}
.drop{position:relative;cursor:default}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pickrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-block:4px}
.thumb.pdfph{display:grid;place-items:center;font-family:var(--f-num);font-weight:500;color:var(--muted);cursor:default}
.pick{min-height:48px;padding-inline:20px;cursor:pointer}
.pick:focus-within{outline:2px solid var(--ai);outline-offset:2px}
.drop .big{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.cam{width:46px;height:46px;color:var(--ai)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--rule-strong);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
input.num{text-align:right}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid .span2{grid-column:span 2}
@media (max-width:420px){.grid .span2{grid-column:auto}}

.qcard{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:16px;border-top:1px solid var(--rule)}
.qcard:first-child{border-top:0}
@media (max-width:640px){.qcard{grid-template-columns:minmax(0,1fr)}}
.thumb{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:5px;border:1px solid var(--rule);background:var(--paper);cursor:zoom-in}
.status{font-size:.82rem;display:flex;align-items:center;gap:8px}
.spinner{width:14px;height:14px;border:2px solid var(--rule-strong);border-top-color:var(--ai);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:500;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.no{color:var(--warn);background:var(--warn-soft)}
.chip.inc{color:var(--ai);background:var(--ai-soft)}
.chip.low{color:var(--shu);background:var(--shu-soft)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.76rem;letter-spacing:.04em;border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--sheet)}
td.r,th.r{text-align:right}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--ai-soft)}
tr.sub td{border-bottom-style:dashed}
tfoot td{font-weight:700;border-top:2px solid var(--rule-strong);border-bottom:0}
.dr{color:var(--ink)} .cr{color:var(--muted)}
.ex td{color:var(--muted);font-style:italic}

.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));padding:14px 16px;border-bottom:1px solid var(--rule)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--sheet);padding:14px 16px}
.kpi .v{font-family:var(--f-num);font-size:1.35rem;font-weight:500}
.kpi.neg .v{color:var(--shu)}

.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:140px;padding-top:8px}
.bar{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;gap:2px}
.bar i{display:block;border-radius:2px 2px 0 0;min-height:1px}
.bar i.s{background:var(--ai)} .bar i.e{background:var(--shu);opacity:.75}
.barlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:.7rem;color:var(--muted);text-align:center;font-family:var(--f-num)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

dialog{border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--sheet);color:var(--ink);padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule)}
dialog .bd{padding:16px;overflow:auto}
#imgView img{display:block;width:100%;max-height:80vh;object-fit:contain}

.split-lines{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.split-line{border:1px solid var(--rule-strong);border-radius:6px;padding:10px}
.split-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.preview-lines{font-size:.82rem;border:1px dashed var(--rule-strong);border-radius:5px;padding:8px 10px;background:var(--paper)}
.preview-lines div{display:flex;justify-content:space-between;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:var(--r);font-size:.9rem;z-index:20;max-width:calc(100vw - 32px)}
.notes li{margin-bottom:6px}
.checklist{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.checkitem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;background:var(--paper)}
.checkitem b{display:block;font-weight:500}
.form-table td.no{font-family:var(--f-display);color:var(--muted);width:2.2em;text-align:center}
.form-table tr.sum td{font-weight:700;border-top:1px solid var(--rule-strong)}
.form-table tr.blank td.nm{color:var(--ai)}
.form-table tr.zero td{color:var(--muted)}
.form-table tr.head td{background:var(--paper);font-weight:700}
.bsinputs{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.confirm-inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem}
</style>
<style>
html[lang="ja"]{--f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;--f-display:"Noto Serif JP","Hiragino Mincho ProN",serif}
html[lang="en"]{--f-display:"Noto Serif TC",Georgia,serif}
.langsw{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.langsw button{appearance:none;border:0;background:none;font:inherit;font-size:.82rem;color:var(--muted);padding:6px 12px;cursor:pointer;min-height:34px}
.langsw button+button{border-left:1px solid var(--rule)}
.langsw button[aria-pressed="true"]{background:var(--ai);color:var(--sheet)}
.langsw button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
.toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.jp{display:block;font-size:.72rem;color:var(--muted)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/ocr.js"></script>
<script src="/books.js"></script>
<script src="/filing.js"></script>
<script src="/imports.js"></script>
</body>
</html>
</head>
<body>
<div class="wrap" id="authView" hidden>
  <div class="sheet pad stack" style="max-width:420px;margin:8vh auto 0">
    <div class="brand"><div class="stamp" aria-hidden="true">帳</div><div><div class="eyebrow" data-i18n="eyebrow"></div><h1>Receipt Ledger</h1></div></div>
    <div class="langsw" role="group" aria-label="Language" style="align-self:flex-start">
      <button data-lang="en" aria-pressed="false">EN</button><button data-lang="ja" aria-pressed="false">日本語</button><button data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <p class="muted small" style="margin:0" data-i18n="authSub"></p>
    <form id="authForm" class="stack" novalidate>
      <label class="f" for="aEmail"><span data-i18n="email"></span><input type="email" id="aEmail" autocomplete="email" required></label>
      <label class="f" for="aPass"><span data-i18n="password"></span><input type="password" id="aPass" autocomplete="current-password" minlength="8" required></label>
      <div class="row"><button class="btn primary" type="submit" id="aSubmit" data-i18n="signIn"></button><button class="btn ghost" type="button" id="aToggle" data-i18n="noAcct"></button></div>
      <p class="small" id="aMsg" style="margin:0"></p>
    </form>
  </div>
</div>
<div class="wrap" id="appView" hidden>
  <header class="top">
    <div class="brand">
      <div class="stamp" aria-hidden="true">帳</div>
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 id="bizName">Receipt Ledger</h1>
      </div>
    </div>
    <div class="toolbar">
      <div class="langsw" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="ja" aria-pressed="false">日本語</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
      </div>
      <button class="btn ghost" id="signOut" data-i18n="signOut"></button>
      <label class="f" for="yearSel"><span data-i18n="yearLabel"></span>
        <select id="yearSel"></select>
      </label>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="scan" aria-selected="true" data-i18n="tabScan"></button>
    <button role="tab" data-tab="journal" aria-selected="false" data-i18n="tabJournal"></button>
    <button role="tab" data-tab="summary" aria-selected="false" data-i18n="tabSummary"></button>
    <button role="tab" data-tab="filing" aria-selected="false" data-i18n="tabFiling"></button>
    <button role="tab" data-tab="settings" aria-selected="false" data-i18n="tabSettings"></button>
  </nav>

  <div id="banners"></div>

  <section data-panel="scan" class="stack">
    <div class="drop" id="drop">
      <svg class="cam" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 16h8l4-6h12l4 6h8v24H6z" stroke-linejoin="round"/><circle cx="24" cy="27" r="8"/></svg>
      <span class="big" data-i18n="dropTitle"></span>
      <div class="pickrow">
        <label class="btn primary pick" for="camIn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="pickCam"></span></label>
        <label class="btn pick" for="fileIn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span data-i18n="pickLib"></span></label>
        <button type="button" class="btn pick" id="driveBtn" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 3h8l6 10.5-4 7H6l-4-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 3l6 10.5H2M16 3L10 13.5M22 13.5H10l-4 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="pickDrive"></span></button>
      </div>
      <span class="muted small" data-i18n="dropSub"></span>
      <input type="file" id="camIn" accept="image/*" capture="environment">
      <input type="file" id="fileIn" accept="image/*,.heic,.heif,application/pdf,.pdf" multiple>
    </div>
    <div class="row">
      <button class="btn" id="manualExp" data-i18n="manualExp"></button>
      <button class="btn" id="manualInc" data-i18n="manualInc"></button>
    </div>
    <div class="sheet" id="queue" hidden></div>
    <p class="muted small" data-i18n="queueHint"></p>
  </section>

  <section data-panel="journal" hidden class="stack">
    <div class="sheet">
      <div class="filters">
        <label class="f" for="fFrom"><span data-i18n="fFrom"></span><input type="date" id="fFrom"></label>
        <label class="f" for="fTo"><span data-i18n="fTo"></span><input type="date" id="fTo"></label>
        <label class="f" for="fMin"><span data-i18n="fMin"></span><input type="number" id="fMin" class="num" inputmode="numeric"></label>
        <label class="f" for="fMax"><span data-i18n="fMax"></span><input type="number" id="fMax" class="num" inputmode="numeric"></label>
        <label class="f" for="fQ"><span data-i18n="fQ"></span><input type="search" id="fQ" placeholder="Amazon"></label>
        <label class="f" for="fAcc"><span data-i18n="fAcc"></span><select id="fAcc"></select></label>
      </div>
      <div class="row pad" style="justify-content:space-between">
        <span class="small muted" id="jCount"></span>
        <button class="btn" id="expJournal" data-i18n="expJournal"></button>
      </div>
      <div class="tablewrap">
        <table id="jTable">
          <thead><tr><th data-i18n="thDate"></th><th data-i18n="thDr"></th><th class="r" data-i18n="thAmt"></th><th data-i18n="thCr"></th><th class="r" data-i18n="thAmt"></th><th data-i18n="thDesc"></th><th data-i18n="thQual"></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section data-panel="summary" hidden class="stack">
    <div class="kpis">
      <div class="kpi"><div class="eyebrow" data-i18n="kSales"></div><div class="v" id="kSales">¥0</div></div>
      <div class="kpi"><div class="eyebrow" data-i18n="kExp"></div><div class="v" id="kExp">¥0</div></div>
      <div class="kpi" id="kIncWrap"><div class="eyebrow" data-i18n="kInc"></div><div class="v" id="kInc">¥0</div></div>
      <div class="kpi"><div class="eyebrow" id="kAfterLabel"></div><div class="v" id="kAfter">¥0</div></div>
    </div>
    <div class="sheet pad stack">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="monthly"></h2>
        <div class="legend"><span style="--c:var(--ai)" data-i18n="legSales"></span><span style="--c:var(--shu)" data-i18n="legExp"></span></div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="barlabels"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span></div>
    </div>
    <div class="sheet">
      <div class="row pad" style="justify-content:space-between">
        <div><h2 data-i18n="byAcc"></h2><p class="small muted" style="margin:0" id="byAccSub"></p></div>
        <button class="btn" id="expSummary" data-i18n="expSummary"></button>
      </div>
      <div class="tablewrap"><table id="accTable"><thead><tr><th data-i18n="thAcc"></th><th class="r" data-i18n="thCount"></th><th class="r" data-i18n="thAmt"></th><th class="r" data-i18n="thShare"></th></tr></thead><tbody></tbody><tfoot></tfoot></table></div>
    </div>
    <div class="sheet pad stack">
      <h2 data-i18n="ctaxTitle"></h2>
      <div class="tablewrap"><table id="ctaxTable"><thead><tr><th data-i18n="thClass"></th><th class="r" data-i18n="th10"></th><th class="r" data-i18n="th8"></th></tr></thead><tbody></tbody></table></div>
      <p class="small muted" id="ctaxNote" style="margin:0"></p>
    </div>
  </section>

  <section data-panel="filing" hidden class="stack">
    <div class="sheet pad stack">
      <div class="row" style="justify-content:space-between"><h2 data-i18n="fiStatus"></h2><button class="btn" id="expFiling" data-i18n="expFiling"></button></div>

function showTab(tb){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tb));

function fillYears(){
  const ys=new Set([now.getFullYear(),now.getFullYear()-1]);entries.forEach(e=>e.date&&ys.add(+e.date.slice(0,4)));
  const arr=[...ys].filter(Boolean).sort((a,b)=>b-a);
  $("#yearSel").innerHTML=arr.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}${lang==="en"?"":"年"} (${t("era")} ${y-2018})</option>`).join("");
}

  return `<div class="split-lines">${d.split.map((l,i)=>`<div class="split-line">

      ${cell(i,"amt10","a10",num(i,"amt10",l.amt10))}${cell(i,"amt8","a8",num(i,"amt8",l.amt8))}${cell(i,"amt0","a0",num(i,"amt0",l.amt0))}
      <label class="f span2" for="${p}_s${i}_memo"><span>${t("memo")}</span><input id="${p}_s${i}_memo" data-s="${i}:memo" value="${esc(l.memo)}"></label>
    </div></div>`).join("")}

// One receipt, several accounts: shared fields once, then one block per account line.

  const id=k=>p+"_"+k;
  return `<div class="grid">
    <label class="f" for="${id("date")}">${t("date")}<input type="date" id="${id("date")}" data-k="date" value="${esc(d.date)}"></label>
    <label class="f span2" for="${id("vendor")}">${t("vendor")}<input id="${id("vendor")}" data-k="vendor" value="${esc(d.vendor)}"></label>
    <label class="f" for="${id("invoiceNo")}">${t("regNo")}<input id="${id("invoiceNo")}" data-k="invoiceNo" value="${esc(d.invoiceNo)}" placeholder="T1234567890123"></label>
    <label class="f" for="${id("credit")}">${t("credit")}<select id="${id("credit")}" data-k="credit">${opts(CREDIT_ACCOUNTS,d.credit,accText)}</select></label>
    <label class="f" for="${id("bizRatio")}">${t("ratio")}<input type="number" min="0" max="100" class="num" id="${id("bizRatio")}" data-k="bizRatio" value="${d.bizRatio??100}"></label>
  </div>${splitHTML(d,p)}<div class="preview-lines" data-preview style="margin-top:12px"></div>`;

// The entries a draft becomes: one, or one per split line (same receipt image, ids <base>-1, -2 …)
function draftEntries(d){
  if(!isSplit(d)) return [d];
  const {split,...shared}=d;
  const lines=split.filter(l=>totalOf(l)>0),n=lines.length;
  return lines.map((l,i)=>({...shared,...Object.fromEntries(LINE_KEYS.map(k=>[k,l[k]])),id:l.id,
    memo:[l.memo,n>1?t("sameReceipt",{i:i+1,n}):""].filter(Boolean).join(" ")}));
}
function readForm(root,base){
  const d={...base};
  root.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;let v=el.value;
    if(["amt10","amt8","amt0","bizRatio"].includes(k)) v=v===""?(k==="bizRatio"?100:0):Math.round(+v);
    if(k==="invoiceNo") v=v.replace(/[\s-]/g,"").toUpperCase();
    d[k]=v;});
  if(Array.isArray(base.split)){d.split=base.split.map(l=>({...l}));
    root.querySelectorAll("[data-s]").forEach(el=>{const [i,k]=el.dataset.s.split(":");let v=el.value;
      if(["amt10","amt8","amt0"].includes(k)) v=v===""?0:Math.round(+v);
      if(d.split[+i]) d.split[+i][k]=v;});}
  return d;
}
function updatePreview(root,base){
  const d=readForm(root,base);
  if(isSplit(d)&&d.type!=="income"){
    const es=draftEntries(d);
    let h=es.flatMap(e=>linesOf(e)).map(l=>`<div><span>Dr ${esc(accText(l.dr))} / Cr ${esc(accText(l.cr))}</span><span class="num">${yen(l.amt)}</span></div>`).join("");
    const sum=d.split.reduce((s,l)=>s+totalOf(l),0),rt=+d.receiptTotal||0;
    h+=`<div class="muted"><span>${rt?t("splitSum",{a:yen(sum),b:yen(rt)}):t("total")}</span><span class="num">${yen(sum)}</span></div>`;
    const c=[isQualified(d.invoiceNo)?`<span class="chip ok">${t("qualified")}</span>`:`<span class="chip no">${t("noReg")}</span>`];
    if(rt&&sum!==rt) c.push(`<span class="chip low">${t("splitOff",{v:yen(Math.abs(sum-rt))})}</span>`);
    h+=`<div style="justify-content:flex-start;gap:6px;margin-top:4px">${c.join("")}</div>`;
    root.querySelector("[data-preview]").innerHTML=h;return;
  }
  let h=linesOf(d).map(l=>`<div><span>Dr ${esc(accText(l.dr))} / Cr ${esc(accText(l.cr))}</span><span class="num">${yen(l.amt)}</span></div>`).join("");
  h+=`<div class="muted"><span>${t("total")}</span><span class="num">${yen(totalOf(d))}</span></div>`;
  if(d.type!=="income"){
    const c=[isQualified(d.invoiceNo)?`<span class="chip ok">${t("qualified")}</span>`:`<span class="chip no">${t("noReg")}</span>`];
    if(d.debit==="消耗品費"&&totalOf(d)>=100000) c.push(`<span class="chip low">${t("bigSupply")}</span>`);
    h+=`<div style="justify-content:flex-start;gap:6px;margin-top:4px">${c.join("")}</div>`;
  }
  root.querySelector("[data-preview]").innerHTML=h;
}
function wireForm(root,base){
  root.addEventListener("input",()=>updatePreview(root,base));
  root.addEventListener("change",e=>{
    const s=e.target.dataset.s;
    if(s&&s.endsWith(":debit")){const i=s.split(":")[0],it=root.querySelector(`[data-s="${i}:items"]`);
      if(it&&(it.value===""||it.value===it.dataset.auto)){const v=ReceiptOCR.summaryFor(e.target.value,base._ctx||"");it.value=v;it.dataset.auto=v;updatePreview(root,base)}return}
    if(e.target.dataset.k!=="debit"||base.type==="income")return;
    const it=root.querySelector('[data-k="items"]');if(!it)return;
    if(it.value===""||it.value===it.dataset.auto){const v=ReceiptOCR.summaryFor(e.target.value,base._ctx||"");it.value=v;it.dataset.auto=v;updatePreview(root,base)}
  });
  updatePreview(root,base);
}

const toRow=d=>({id:d.id,type:d.type,date:d.date,vendor:d.vendor||"",invoice_no:d.invoiceNo||"",items:d.items||"",amt10:+d.amt10||0,amt8:+d.amt8||0,amt0:+d.amt0||0,
  debit:d.debit,credit:d.credit,biz_ratio:d.bizRatio,memo:d.memo||"",receipt_path:d.assetId||null,ai_confidence:d.aiConfidence||"",updated_at:new Date().toISOString()});
const fromRow=r=>({id:r.id,type:r.type,date:r.date,vendor:r.vendor,invoiceNo:r.invoice_no,items:r.items,amt10:r.amt10,amt8:r.amt8,amt0:r.amt0,debit:r.debit,credit:r.credit,
  bizRatio:r.biz_ratio,memo:r.memo,assetId:r.receipt_path||"",aiConfidence:r.ai_confidence,createdAt:r.created_at});
async function loadEntries(){
  const out=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from("entries").select("*").order("date",{ascending:false}).range(from,from+999);
    if(error){banner("bRead","err",error.message);break}
    out.push(...data);if(data.length<1000)break;
  }
  entries=out.map(fromRow);fillYears();render();
}
async function saveEntry(d,opt){
  if(!sb||!uid) throw {message:t("errStore")};
  if(!d.date) throw {message:t("errDate")};
  if(totalOf(d)<=0) throw {message:t("errAmt")};
  const id=d.id||("e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const inc=d.type==="income";
  const row=toRow({...d,id,credit:inc?"売上高":(d.credit||"事業主借"),bizRatio:inc?100:(d.bizRatio===""?100:+d.bizRatio)});
  const {error}=await sb.from("entries").upsert(row);
  if(error) throw {message:error.message};
  if(!(opt&&opt.noReload)) await loadEntries();
  return id;
}

// Drive problems stay on screen (a short toast is easy to miss)
function showDriveError(text){
  let b=$("#driveErrBox");
  if(!b){b=document.createElement("div");b.id="driveErrBox";b.className="banner err small";b.style.margin="0";$("#drop").after(b)}
  b.innerHTML=`${esc(text)} <button class="btn ghost small" type="button">${t("close")}</button>`;
  b.querySelector("button").onclick=()=>b.remove();
}
$("#driveBtn").onclick=async()=>{
  const old=$("#driveErrBox");if(old)old.remove();
  if(!googleCfg)return;
  const btn=$("#driveBtn");btn.disabled=true;toast(t("driveOpening"));
  try{
    const done=new Set(settings.driveImported||[]);
    const res=await Imports.pickFromDrive(googleCfg,{locale:lang==="zh"?"zh-TW":lang,skip:id=>done.has(id),onProgress:(n,all)=>toast(t("driveDownloading",{n,all}))});
    if(res&&res.redirecting){try{sessionStorage.setItem("gdrive_resume","1")}catch(e){}toast(t("driveRedirect"));return}
    const files=res.filter(f=>f instanceof File),skipped=res.filter(f=>f.skipped).length,failed=res.filter(f=>f.error);
    if(files.length)addFiles(files);
    const msg=[];if(files.length)msg.push(t("driveAdded",{n:files.length}));if(skipped)msg.push(t("driveSkipped",{n:skipped}));if(failed.length)msg.push(t("driveFailed",{n:failed.length}));
    if(msg.length)toast(msg.join(" "));else toast(t("driveNone"));
  }catch(e){
    console.error("Google Drive import failed",e);
    const key={scope:"driveScope",access_denied:"driveDenied",picker:"drivePicker"}[e&&e.code];
    showDriveError(key?t(key):t("driveErr")+(e&&e.message||e));
  }
  finally{btn.disabled=false}
};

["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));

async function downscale(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));}finally{URL.revokeObjectURL(url)}
}
function addFiles(files){
  [...files].filter(f=>Imports.accepted(f)).forEach(f=>queue.push({id:"q"+Math.random().toString(36).slice(2,8),file:f,driveId:f.driveId||"",
    isPdf:Imports.isPdf(f),url:Imports.isPdf(f)||Imports.isHeic(f)?"":URL.createObjectURL(f),status:"waiting",draft:null}));
  renderQueue();pump();
}
let pumping=false;
async function pump(){if(pumping)return;pumping=true;try{for(const q of queue)if(q.status==="waiting")await processOne(q)}finally{pumping=false}}
async function blobToB64(b){const buf=new Uint8Array(await b.arrayBuffer());let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(bin)}
async function scanReceipt(blob,q){
  if(!aiEnabled){
    const el=()=>document.getElementById("prog_"+q.id);
    try{
      return await window.ReceiptOCR.readReceipt(blob,{year,original:q.isPdf?blob:(q.src||q.file),
        onLanguage:l=>{q.langMsg=t("rereading",{l:t("lang_"+l)});const e=el();if(e)e.textContent=q.langMsg},
        onSecondPass:()=>{q.langMsg=t("secondPass");const e=el();if(e)e.textContent=q.langMsg},
        onTablePass:()=>{q.langMsg=t("tablePass");const e=el();if(e)e.textContent=q.langMsg},
        onProgress:m=>{const e=el();if(!e)return;const pre=q.langMsg?q.langMsg+" ":"";
        e.textContent=pre+(m.status==="recognizing text"?Math.round((m.progress||0)*100)+"%":(/load|initializ/.test(m.status||"")?t("ocrLoading"):""))}});
    }catch(e){throw {code:"ocr",message:e&&e.message||String(e)}}
  }
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(session?session.access_token:"")},
    body:JSON.stringify({image:await blobToB64(blob),mediaType:blob.type||"image/jpeg",lang,year,hint:settings.hint||"",accounts:EXPENSE_ACCOUNTS,pdfText:q.isPdf?(q.pdfText||"").slice(0,6000):""})});
  let body={};try{body=await res.json()}catch(e){}
  if(!res.ok) throw {code:res.status===401||res.status===403?"auth":res.status===429?"rate_limited":"server",message:body.error||("HTTP "+res.status)};
  return body;
}
async function processOne(q){
  q.status="reading";renderQueue();
  const prog=m=>{const e=document.getElementById("prog_"+q.id);if(e)e.textContent=m};
  let blob,src=q.file;
  try{
    if(Imports.isHeic(src)&&!(await Imports.canDecode(src))){prog(t("heicConv"));src=await Imports.heicToJpeg(src);q.url=URL.createObjectURL(src);renderQueue()}
    if(q.isPdf){prog(t("pdfReading"));const p=await Imports.readPdf(src);q.pdfText=p.text||"";blob=p.image;q.url=URL.createObjectURL(blob);renderQueue()}
    else{q.url=q.url||URL.createObjectURL(src);try{blob=await downscale(src)}catch(e){blob=src}}
  }catch(e){
    q.status="manual";q.errKey="eFile";q.errExtra=e&&e.message||"";q.draft={type:"expense",date:"",vendor:"",invoiceNo:"",items:"",amt10:0,amt8:0,amt0:0,debit:"消耗品費",credit:settings.card,bizRatio:100,memo:""};renderQueue();return;
  }
  q.blob=blob;q.src=src;
  const base={type:"expense",date:"",vendor:"",invoiceNo:"",items:"",amt10:0,amt8:0,amt0:0,debit:"消耗品費",credit:settings.card,bizRatio:100,memo:""};
  try{
    // A PDF with real text (most e-receipts) is read directly — exact, no OCR needed.
    const pdfTextOk=q.isPdf&&(q.pdfText||"").replace(/\s/g,"").length>=20;
    const r=(!aiEnabled&&pdfTextOk)?{...ReceiptOCR.parseReceiptText(q.pdfText,{year}),confidence:"high",fromPdfText:true}:await scanReceipt(blob,q);
    q.fromPdfText=!!r.fromPdfText;
    q.draft={...base,date:r.date||"",vendor:r.vendor||"",invoiceNo:(r.invoice_no||"").replace(/[\s-]/g,"").toUpperCase(),items:r.items||"",
      amt10:Math.round(+r.amount_10||0),amt8:Math.round(+r.amount_8||0),amt0:Math.round(+r.amount_other||0),
      debit:EXPENSE_ACCOUNTS.includes(r.account)?r.account:"雑費",credit:String(r.payment)==="cash"?settings.cash:settings.card,
      aiConfidence:r.confidence||"",aiNotes:r.notes||""};
    const cur=String(r.currency||"JPY").toUpperCase();
    if(cur!=="JPY"){
      // Overseas purchase: not yen, and outside Japanese consumption tax → user converts and enters it as 不課税.
      q.draft.amt10=q.draft.amt8=q.draft.amt0=0;
      q.draft.memo=`${cur} ${r.foreign_total??r.total??""}`.trim();
      q.draft.aiNotes=t("fxNote",{c:cur,a:r.foreign_total??r.total??"?"})+(r.notes?" "+r.notes:"");
      q.draft.aiConfidence="low";
    }else if(totalOf(q.draft)===0&&r.total) q.draft.amt10=Math.round(+r.total);
    q.draft.detectedLang=r.language||"";
    // 摘要: generic Japanese label (打合せ飲食代…); 備考: the items on the receipt
    const list=Array.isArray(r.item_list)?r.item_list.filter(Boolean).map(String):[];
    q.draft._ctx=[r.vendor,r.items,list.join(" "),q.pdfText||"",r.raw_text||""].join("\n");
    const auto=(r.items&&!r.fromPdfText&&aiEnabled)?r.items:(ReceiptOCR.summaryFor(q.draft.debit,q.draft._ctx)||r.items||"");
    q.draft.items=auto;q.draft.itemsAuto=auto;
    if(list.length){const it=list.slice(0,12).join("、")+(list.length>12?" ほか"+(list.length-12)+"点":"");q.draft.memo=q.draft.memo?q.draft.memo+"／"+it:it}
    // vendor is the issuing company (株式会社…); keep the shop name in the memo
    // keep the shop name only when it adds something (not just the company name again)
    const core=x=>String(x||"").replace(/株式会社|有限会社|合同会社|[（(]\s*[株有]\s*[)）]|株$|\s/g,"");
    if(r.store&&core(r.store)&&!core(q.draft.vendor).includes(core(r.store))&&!core(r.store).includes(core(q.draft.vendor))){q.draft.memo="店舗："+r.store+(q.draft.memo?"／"+q.draft.memo:"")}
    // meals: remind that a solo meal is personal; takeout food/groceries are usually personal too
    let hint=r.hint||(/^(会議費|接待交際費)$/.test(q.draft.debit)?"meal":"");
    q.draft.receiptTotal=totalOf(q.draft);
    // Items belonging to different accounts → one line per account (same receipt image)
    const rl=Array.isArray(r.lines)?r.lines.filter(l=>l&&EXPENSE_ACCOUNTS.includes(l.account)):[];
    if(cur==="JPY"&&rl.length>=2){
      const store=(q.draft.memo.match(/^店舗：[^／]*/)||[""])[0];
      q.draft.split=rl.map(l=>{const il=Array.isArray(l.item_list)?l.item_list.filter(Boolean).map(String):[];
        const lab=(l.items&&aiEnabled&&!r.fromPdfText)?String(l.items):(ReceiptOCR.summaryFor(l.account,il.join(" "))||l.items||"");
        return {debit:l.account,items:lab,itemsAuto:lab,amt10:Math.round(+l.amount_10||0),amt8:Math.round(+l.amount_8||0),amt0:Math.round(+l.amount_other||0),
          memo:[store,il.join("、")].filter(Boolean).join("／"),hint:l.hint||""}});
      q.draft.debit=q.draft.split[0].debit;
      const hs=q.draft.split.map(l=>l.hint).filter(Boolean);hint=hs.includes("golf")?"golf":hs.includes("meal")?"meal":hs[0]||"";
      q.draft.aiNotes=t("splitNote",{n:q.draft.split.length})+(q.draft.aiNotes?" "+q.draft.aiNotes:"");
    }
    if(hint&&cur==="JPY") q.draft.aiNotes=(q.draft.aiNotes?q.draft.aiNotes+" ":"")+t({meal:"mealNote",golf:"golfNote"}[hint]||"food8Note");
    q.status="review";q.errKey=null;
  }catch(e){
    const m={auth:"eAuthApi",rate_limited:"eRate",invalid_json:"eJson",ocr:"eOcr"};
    q.status="manual";q.errKey=m[e&&e.code]||"eServer";q.errExtra=(m[e&&e.code]&&e.code!=="ocr")?"":(e&&e.message||"");q.draft=base;
  }
  renderQueue();
}
function renderQueue(){
  const box=$("#queue");box.hidden=queue.length===0;box.innerHTML="";

    const card=document.createElement("div");card.className="qcard";
    let right="";
    if(q.status==="waiting"||q.status==="reading") right=`<div class="status">${q.status==="reading"?`<span class="spinner"></span>${t(aiEnabled?"reading":"ocrReading")} <span class="num" id="prog_${q.id}"></span>`:t("waiting")}</div>`;
    else if(q.status==="saved"){const es=draftEntries(q.draft);right=`<div class="status"><span class="chip ok">${t("posted")}</span><span class="muted">${esc(q.draft.date)} ${esc(q.draft.vendor)} ${yen(es.reduce((s,e)=>s+totalOf(e),0))}${es.length>1?" · "+es.map(e=>esc(accText(e.debit))).join(" / "):""}</span></div>`}
    else{
      const c=q.draft.aiConfidence;
      const note=q.errKey?`<div class="banner warn small" style="margin:0 0 12px">${esc(t(q.errKey)+(q.errExtra||""))}</div>`:
        `<div class="small" style="margin-bottom:10px">${c==="low"?`<span class="chip low">${t("lowConf")}</span> `:c?`<span class="chip inc">${t(q.fromPdfText?"pdfFilled":aiEnabled?"aiFilled":"ocrFilled")}</span> `:""}${q.draft.detectedLang&&I18N.en["lang_"+q.draft.detectedLang]?`<span class="chip inc">${t("detected",{l:t("lang_"+q.draft.detectedLang)})}</span> `:""}${q.draft.aiNotes?`<span class="muted">${esc(q.draft.aiNotes)}</span>`:""}</div>`;
      right=`${note}<div data-form>${formHTML(q.draft,q.id,{splittable:true})}</div>
        <div class="row" style="margin-top:12px"><button class="btn primary" data-save>${t("confirm")}</button><button class="btn ghost" data-retry ${sample&&canImages?"":"hidden"}>${t("retry")}</button><button class="btn ghost" data-drop>${t("remove")}</button><span class="small" data-msg></span></div>`;
    }
    card.innerHTML=`<div class="stack" style="gap:8px">${q.url?`<img class="thumb" src="${q.url}" alt="${esc(t("receiptImg"))}" data-zoom="${q.url}">`:`<div class="thumb pdfph">${q.isPdf?"PDF":"HEIC"}</div>`}`+`<span class="small muted" style="overflow-wrap:anywhere">${esc(q.file.name)}</span></div><div style="min-width:0">${right}</div>`;
    box.appendChild(card);
    const form=card.querySelector("[data-form]");
    if(form){
      wireForm(form,q.draft);
      form.addEventListener("input",()=>{q.draft=readForm(form,q.draft)});
      form.addEventListener("click",ev=>{
        const b=ev.target.closest("[data-splitbtn],[data-addline],[data-delline]");if(!b)return;
        const d=readForm(form,q.draft);
        const blank=()=>({debit:"消耗品費",items:"",itemsAuto:"",amt10:0,amt8:0,amt0:0,memo:""});
        if(b.hasAttribute("data-splitbtn")){d.receiptTotal=d.receiptTotal||totalOf(d);d.split=[Object.fromEntries(LINE_KEYS.map(k=>[k,d[k]])),blank()];d.split[0].itemsAuto=d.itemsAuto||""}
        else if(b.hasAttribute("data-addline")) d.split.push(blank());
        else{d.split.splice(+b.dataset.delline,1);
          if(d.split.length<2){const l=d.split[0]||blank();LINE_KEYS.forEach(k=>d[k]=l[k]);d.itemsAuto=l.itemsAuto||"";delete d.split}}
        q.draft=d;renderQueue();
      });
      card.querySelector("[data-save]").onclick=async ev=>{
        const btn=ev.currentTarget;btn.disabled=true;const msg=card.querySelector("[data-msg]");const d=readForm(form,q.draft);
        try{if(q.blob&&!d.assetId){msg.textContent=t("uploading");
          const ext=q.isPdf?"pdf":"jpg";
          const path=`${uid}/${(d.date||todayStr()).slice(0,7)}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}.${ext}`;
          const {error}=await sb.storage.from("receipts").upload(path,q.isPdf?q.file:q.blob,{contentType:q.isPdf?"application/pdf":"image/jpeg",upsert:false});
          if(error)throw error;d.assetId=path}}
        catch(e){msg.textContent=t("photoFail",{e:e.message||e.code})}
        try{
          const es=draftEntries(d);
          if(isSplit(d)){
            if(!es.length) throw {message:t("errAmt")};
            const base="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
            // fixed ids per line, so pressing Confirm again after an error never posts a line twice
            let n=0;d.split.forEach(l=>{if(totalOf(l)>0&&!l.id)l.id=base+"-"+(++n)});
            for(const e of draftEntries(d)) await saveEntry(e,{noReload:true});
            await loadEntries();
          }else await saveEntry(d);
          q.draft=d;q.status="saved";renderQueue();toast(es.length>1?t("tPostedN",{n:es.length}):t("tPosted",{v:d.vendor||d.items}));
          if(q.driveId){settings.driveImported=settings.driveImported||[];if(!settings.driveImported.includes(q.driveId)){settings.driveImported.push(q.driveId);persistSettings()}}}
        catch(e){btn.disabled=false;msg.textContent=e.message||t("saveFail");msg.style.color="var(--shu)"}
      };
      card.querySelector("[data-retry]").onclick=()=>{q.status="waiting";q.errKey=null;renderQueue();pump()};
      card.querySelector("[data-drop]").onclick=()=>{URL.revokeObjectURL(q.url);queue.splice(queue.indexOf(q),1);renderQueue()};
    }
  });
  box.querySelectorAll("[data-zoom]").forEach(i=>i.onclick=()=>zoom(i.dataset.zoom));
}

  const item=(ok,title,detail,state)=>`<div class="checkitem"><span class="chip ${state==="na"?"inc":ok?"ok":"no"}">${state==="na"?t("fiNA"):ok?t("fiDone"):t("fiTodo")}</span><div><b>${title}</b><span class="small muted">${detail}</span></div></div>`;
  $("#fStatus").innerHTML=[
    item(true,t("sFiling"),esc(t("f_"+settings.filing))),
    item(incomeN>0,t("fiIncome"),t("fiIncomeD",{n:incomeN,v:yen(pl.sales)})),
    item(!big.length,t("fiAssets"),big.length?t("fiAssetsBig",{n:big.length}):t("fiAssetsD",{n:dep.rows.length})),
    needBS?item(filled(b.open),t("fiOpen"),t("fiOpenD")):item(true,t("fiOpen"),t("fiBSnot"),"na"),
    needBS?item(bs.closeEntered,t("fiClose"),t("fiCloseD")):item(true,t("fiClose"),t("fiBSnot"),"na"),
    needBS?item(bs.diff===0&&bs.closeEntered,t("fiBalanced"),bs.diff===0?t("bsBalanced"):t("bsDiff",{v:yen(bs.diff)})):"",
  ].join("");
  // p.1
  $("#plTitle").textContent=blue?"青色申告決算書（一般用）1ページ：損益計算書":"収支内訳書（一般用）：収支の計算";
  const notes=[];
  if(pl.rows.some(r=>r.blank&&r.name))notes.push(t("plBlank"));
  if(pl.merged.length)notes.push(t("plMerged",{list:pl.merged.join("・")}));
  if(blue)notes.push(t("plNote"));else notes.push(t("plWhite"));
  if(dep.smallOver)notes.push(t("smallOver",{v:yen(dep.smallTotal)}));
  $("#plNotes").textContent=notes.join(" ");
  $("#fPL tbody").innerHTML=pl.rows.filter(r=>blue||!/青色申告特別控除/.test(r.name)).map(r=>{
    const cls=[r.sum?"sum":"",r.blank?"blank":"",!r.v&&!r.sum?"zero":""].join(" ");
    const nm=r.blank&&!r.name?`<span class="muted">（空欄）</span>`:esc(r.name)+(ACC_TR[r.name]&&lang!=="ja"?` <span class="muted small">${esc(ACC_TR[r.name][lang==="en"?0:1])}</span>`:"");
    return `<tr class="${cls}"><td class="no">${blue?r.no:""}</td><td class="nm">${nm}</td><td class="r num">${yen(r.v)}</td></tr>`;
  }).join("");
  // p.2
  const mo=Filing.monthly({entries,year,totalOf,bizOf});
  $("#fMonthly tbody").innerHTML=mo.map(m=>`<tr class="${m.sales||m.purchases?"":"zero"}"><td>${m.m}月</td><td class="r num">${yen(m.sales)}</td><td class="r num">${yen(m.purchases)}</td></tr>`).join("");
  $("#fMonthly tfoot").innerHTML=`<tr><td>計</td><td class="r num">${yen(mo.reduce((s,m)=>s+m.sales,0))}</td><td class="r num">${yen(mo.reduce((s,m)=>s+m.purchases,0))}</td></tr>`;
  const rent=Filing.rentDetail({entries,year,totalOf,bizOf});
  $("#fRent tbody").innerHTML=rent.length?rent.map(r=>`<tr><td>${esc(r.payee)}</td><td class="r num">${yen(r.total)}</td><td class="r num">${yen(r.business)}</td></tr>`).join(""):`<tr><td colspan="3" class="muted">${t("noRent")}</td></tr>`;
  // p.3
  $("#fBig").innerHTML=big.length?`<div class="banner warn small" style="margin:0">${t("bigWarn")}<ul style="margin:6px 0 0;padding-left:1.2em">${big.map(e=>`<li>${esc(e.date)} ${esc(e.vendor||e.items||"")} ${accHTML(e.debit)} <span class="num">${yen(totalOf(e))}</span></li>`).join("")}</ul></div>`:"";
  const M={sl:"定額法",lump3:"一括償却（3年）",small:"少額減価償却資産の特例"};
  const list=assetsList();
  $("#fDep tbody").innerHTML=dep.rows.length?dep.rows.map(r=>{const i=list.indexOf(list.find(a=>a.id===r.id));return `<tr>
    <td>${esc(r.name)}</td><td class="num">${esc(r.date)}</td><td class="r num">${yen(r.cost)}</td><td>${M[r.method]||M.sl}</td>
    <td class="r num">${r.method==="sl"?esc(r.life)+"年":"—"}</td><td class="r num">${r.method==="sl"?r.rate.toFixed(3):"—"}</td><td class="r num">${r.months}/12</td>
    <td class="r num">${yen(r.dep)}</td><td class="r num">${r.ratio}%</td><td class="r num">${yen(r.business)}</td><td class="r num">${yen(r.close)}</td>
    <td style="white-space:nowrap"><button class="btn ghost small" data-aedit="${i}">${t("aEdit")}</button><span data-adelwrap="${i}"><button class="btn ghost small" data-adel="${i}">${t("del")}</button></span></td></tr>`}).join("")
    :`<tr><td colspan="12" class="muted">${t("noAssets")}</td></tr>`;
  $("#fDep tfoot").innerHTML=dep.rows.length?`<tr><td colspan="7">計</td><td class="r num">${yen(dep.dep)}</td><td></td><td class="r num">${yen(dep.business)}</td><td class="r num">${yen(dep.close)}</td><td></td></tr>`:"";
  $("#fDep tbody").querySelectorAll("[data-aedit]").forEach(bt=>bt.onclick=()=>loadAsset(+bt.dataset.aedit));
  $("#fDep tbody").querySelectorAll("[data-adel]").forEach(bt=>bt.onclick=()=>{
    const i=+bt.dataset.adel,w=$(`[data-adelwrap="${i}"]`);
    w.innerHTML=`<button class="btn danger small" data-ayes>${t("del")}</button><button class="btn ghost small" data-ano>${t("cancel")}</button>`;
    w.querySelector("[data-ano]").onclick=renderFiling;
    w.querySelector("[data-ayes]").onclick=async()=>{assetsList().splice(i,1);renderFiling();const e=await persistSettings();toast(e?t("saveFail"):t("tDeleted"))};
  });
  // p.4
  $("#bsBox").hidden=!blue;
  const inp=(side,k,label)=>`<label class="f" for="bs_${side}_${k}"><span>${esc(bsLabel(label))}</span><input type="number" inputmode="numeric" class="num" id="bs_${side}_${k}" data-bs="${side}.${k}" value="${b[side][k]??""}" placeholder="0"></label>`;
  const active=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.bs:null;
  if(!active){
    $("#bsOpenIn").innerHTML=BS_OPEN.map(([k,l])=>inp("open",k,l)).join("");
    $("#bsCloseIn").innerHTML=BS_CLOSE.map(([k,l])=>inp("close",k,l)).join("");
  }
  const rowsOf=(a,c,head)=>`<tr class="head"><td colspan="3">${head}</td></tr>`+a.map((r,i)=>`<tr class="${r[1]||c[i][1]?"":"zero"}"><td>${esc(r[0])}</td><td class="r num">${yen(r[1])}</td><td class="r num">${yen(c[i][1])}</td></tr>`).join("");
  $("#fBS tbody").innerHTML=rowsOf(bs.assetsOpen,bs.assetsClose,"資産の部")
    +`<tr class="sum"><td>合計</td><td class="r num">${yen(bs.totals.assetsOpen)}</td><td class="r num">${yen(bs.totals.assetsClose)}</td></tr>`
    +rowsOf([...bs.liabOpen,...bs.capOpen],[...bs.liabClose,...bs.capClose],"負債・資本の部")
    +`<tr class="sum"><td>合計</td><td class="r num">${yen(bs.totals.liabOpen)}</td><td class="r num">${yen(bs.totals.liabClose)}</td></tr>`;
  const adj=[];
  if(bs.adj.bank<0)adj.push(t("bsAdjBankLess",{v:yen(-bs.adj.bank)}));
  if(bs.adj.bank>0)adj.push(t("bsAdjBankMore",{v:yen(bs.adj.bank)}));
  if(bs.adj.cash<0)adj.push(t("bsAdjCashLess",{v:yen(-bs.adj.cash)}));
  if(bs.adj.cash>0)adj.push(t("bsAdjCashMore",{v:yen(bs.adj.cash)}));
  $("#bsAdj").innerHTML=(bs.closeEntered?(bs.diff===0?`<span class="chip ok">${t("bsBalanced")}</span> `:`<span class="chip low">${t("bsDiff",{v:yen(bs.diff)})}</span> `):`<span class="chip no">${t("bsNeedClose")}</span> `)+adj.map(esc).join(" ");
  // steps
  $("#fSteps").innerHTML=t("steps").map(x=>`<li>${x}</li>`).join("");
}
// balance inputs: live recalculation + auto-save
$("#bsBox").addEventListener("input",e=>{const k=e.target.dataset.bs;if(!k)return;const [side,f]=k.split(".");const b=yearBS();b[side][f]=e.target.value===""?"":Math.round(+e.target.value);renderFiling();saveSoon()});
// asset form
function fillAssetForm(){
  $("#aPreset").innerHTML=Filing.PRESETS.map(p=>`<option value="${p.key}">${esc(p.ja)}${p.life?` (${p.life}年)`:""}</option>`).join("");
  $("#aMethod").innerHTML=opts(["sl","lump3","small"],$("#aMethod").value||"sl",k=>({sl:"定額法",lump3:"一括償却資産（3年均等）",small:"少額減価償却資産の特例（青色）"})[k]);
  $("#aPaid").innerHTML=opts(["事業主借","普通預金","現金","未払金"],$("#aPaid").value||"事業主借",accText);
  $("#aSave").textContent=t(editingAsset>=0?"saveChanges":"aAdd");
  $("#aCancel").hidden=editingAsset<0;
}
$("#aPreset").addEventListener("change",()=>{const p=Filing.PRESETS.find(x=>x.key===$("#aPreset").value);if(p&&p.life)$("#aLife").value=p.life});
function loadAsset(i){
  const a=assetsList()[i];if(!a)return;editingAsset=i;
  $("#assetBox").open=true;$("#aName").value=a.name;$("#aDate").value=a.date;$("#aCost").value=a.cost;$("#aLife").value=a.life||"";$("#aRatio").value=a.ratio??100;
  fillAssetForm();$("#aMethod").value=a.method;$("#aPaid").value=a.paidFrom||"事業主借";$("#aPreset").value=a.preset||"other";
  $("#assetBox").scrollIntoView({behavior:"smooth",block:"center"});
}
$("#aCancel").onclick=()=>{editingAsset=-1;["aName","aDate","aCost","aLife"].forEach(id=>$("#"+id).value="");$("#aRatio").value=100;$("#aMsg").textContent="";fillAssetForm()};
$("#aSave").onclick=async()=>{
  const msg=$("#aMsg");msg.style.color="var(--shu)";
  const a={id:editingAsset>=0?assetsList()[editingAsset].id:"a"+Date.now().toString(36),name:$("#aName").value.trim(),date:$("#aDate").value,cost:Math.round(+$("#aCost").value||0),
    method:$("#aMethod").value,life:Math.round(+$("#aLife").value||0),ratio:Math.min(100,Math.max(0,Math.round(+($("#aRatio").value||100)))),paidFrom:$("#aPaid").value,preset:$("#aPreset").value};
  a.cat=(Filing.PRESETS.find(p=>p.key===a.preset)||{}).cat||"工具器具備品";
  if(!a.name||!a.date||!a.cost){msg.textContent=t("aErrReq");return}
  if(a.cost<100000){msg.textContent=t("aErrCheap");return}
  if(a.method==="lump3"&&(a.cost<100000||a.cost>=200000)){msg.textContent=t("aErrLump");return}
  const lim=Filing.smallLimit(a.date);
  if(a.method==="small"&&(!isBlue()||a.cost>=lim)){msg.textContent=t("aErrSmall",{lim:lim.toLocaleString("ja-JP")});return}
  if(a.method==="sl"&&(a.life<2||a.life>50)){msg.textContent=t("aErrLife");return}
  if(editingAsset>=0)assetsList()[editingAsset]=a;else assetsList().push(a);
  const e=await persistSettings();
  if(e){msg.textContent=t("saveFail")+": "+e.message;return}
  msg.style.color="";msg.textContent=t("saved");$("#aCancel").onclick();renderFiling();
};
// export
$("#expFiling").onclick=()=>{
  const {b,dep,pl,bs}=filingCalc(),blue=isBlue();
  const rows=[[blue?"青色申告決算書（一般用）":"収支内訳書（一般用）",`${year}年分`,settings.name||""],[],[blue?"1ページ 損益計算書":"収支の計算"],["欄","科目","金額"]];
  pl.rows.filter(r=>blue||!/青色申告特別控除/.test(r.name)).forEach(r=>rows.push([blue?r.no:"",r.name||"（空欄）",r.v]));
  rows.push([],["2ページ 月別売上（収入）金額及び仕入金額"],["月","売上（収入）金額","仕入金額"]);
  Filing.monthly({entries,year,totalOf,bizOf}).forEach(m=>rows.push([m.m+"月",m.sales,m.purchases]));
  rows.push([],["地代家賃の内訳"],["支払先","本年中の賃借料","必要経費算入額"]);
  Filing.rentDetail({entries,year,totalOf,bizOf}).forEach(r=>rows.push([r.payee,r.total,r.business]));
  rows.push([],["3ページ 減価償却費の計算"],["名称","取得年月","取得価額","償却方法","耐用年数","償却率","本年中の償却期間","本年分の償却費","事業専用割合","本年分の必要経費算入額","未償却残高（期末）"]);
  dep.rows.forEach(r=>rows.push([r.name,r.date,r.cost,{sl:"定額法",lump3:"一括償却",small:"少額特例"}[r.method],r.method==="sl"?r.life:"",r.method==="sl"?r.rate:"",r.months+"/12",r.dep,r.ratio+"%",r.business,r.close]));
  if(blue){
    rows.push([],["4ページ 貸借対照表"],["科目","期首","期末"]);
    const both=(a,c)=>a.forEach((r,i)=>rows.push([r[0],r[1],c[i][1]]));
    rows.push(["資産の部"]);both(bs.assetsOpen,bs.assetsClose);rows.push(["合計",bs.totals.assetsOpen,bs.totals.assetsClose]);
    rows.push(["負債・資本の部"]);both([...bs.liabOpen,...bs.capOpen],[...bs.liabClose,...bs.capClose]);rows.push(["合計",bs.totals.liabOpen,bs.totals.liabClose]);
  }
  save(`${blue?"青色申告決算書":"収支内訳書"}_${year}.csv`,csv(rows));
};

// ===== settings =====
function fillSettings(){
  $("#sName").value=settings.name||"";
  $("#sFiling").innerHTML=opts(["blue65","blue55","blue10","white"],settings.filing,k=>t("f_"+k));
  $("#sCtax").innerHTML=opts(["exempt","simple","niwari","general"],settings.ctax,k=>t("c_"+k));
  $("#sCash").innerHTML=opts(["事業主借","現金"],settings.cash,accText);
  $("#sCard").innerHTML=opts(["事業主借","未払金","普通預金"],settings.card,accText);
  $("#sShoGaku").innerHTML=opts(["0","1"],settings.shogaku,k=>t("sg"+k));
  $("#sHint").value=settings.hint||"";
  $("#bizName").textContent=settings.name||"Receipt Ledger";
}
$("#saveSettings").onclick=async()=>{
  const s={kind:"settings",name:$("#sName").value.trim(),filing:$("#sFiling").value,ctax:$("#sCtax").value,cash:$("#sCash").value,card:$("#sCard").value,shogaku:$("#sShoGaku").value,hint:$("#sHint").value.trim(),lang};
  Object.assign(settings,s);fillSettings();render();
  const error=await persistSettings();
  $("#setMsg").textContent=error?t("saveFail")+": "+error.message:t("saved");
};

function render(){
  const a=document.querySelector("nav.tabs [aria-selected=true]")?.dataset.tab;
  if(a==="journal")renderJournal();if(a==="summary")renderSummary();if(a==="filing"){fillAssetForm();renderFiling()}
}
try{const tb=localStorage.getItem("tab");if(tb)showTab(tb)}catch(e){}
applyLang();

// ===== auth & data (Supabase) =====
let signUpMode=false;
function setAuthMode(up){signUpMode=up;$("#aSubmit").dataset.i18n=up?"signUp":"signIn";$("#aToggle").dataset.i18n=up?"haveAcct":"noAcct";
  $("#aPass").autocomplete=up?"new-password":"current-password";applyLang()}
$("#aToggle").onclick=()=>setAuthMode(!signUpMode);
$("#authForm").addEventListener("submit",async e=>{
  e.preventDefault();const msg=$("#aMsg");msg.style.color="";msg.textContent="…";
  const email=$("#aEmail").value.trim(),password=$("#aPass").value;
  const r=signUpMode?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email,password});
  if(r.error){msg.style.color="var(--shu)";msg.textContent=t("authErr")+r.error.message;return}
  if(signUpMode&&!r.data.session){msg.textContent=t("checkEmail");setAuthMode(false);return}
  msg.textContent="";
});
$("#signOut").onclick=async()=>{await sb.auth.signOut()};
async function onSession(session){
  const signedIn=!!session;$("#authView").hidden=signedIn;$("#appView").hidden=!signedIn;
  if(!signedIn){uid=null;entries=[];return}
  if(uid===session.user.id)return;
  uid=session.user.id;
  const {data}=await sb.from("settings").select("data").eq("user_id",uid).maybeSingle();
  if(data&&data.data){settings={...settings,...data.data};
    let stored=null;try{stored=localStorage.getItem("lang")}catch(e){}
    if(!stored&&data.data.lang&&I18N[data.data.lang])lang=data.data.lang;}
  applyLang();await loadEntries();
  if(driveReturn){const r=driveReturn;driveReturn=null;
    if(r.ok){let resume=false;try{resume=sessionStorage.getItem("gdrive_resume")==="1";sessionStorage.removeItem("gdrive_resume")}catch(e){}
      if(resume&&googleCfg){showTab("scan");setTimeout(()=>$("#driveBtn").click(),300)}}
    else showDriveError(t({scope:"driveScope",access_denied:"driveDenied"}[r.error]||"driveFail"))}
}
(async()=>{
  try{
    const cfg=await (await fetch("/api/config")).json();
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw 0;
    aiEnabled=!!cfg.aiEnabled;
    googleCfg=cfg.googleClientId&&cfg.googleApiKey&&cfg.googleAppId?cfg:null;
    $("#driveBtn").hidden=!googleCfg;
    sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  }catch(e){$("#authView").hidden=false;$("#authForm").hidden=true;$("#aMsg").textContent=t("eCfg");return}
  sb.auth.onAuthStateChange((_ev,session)=>{setTimeout(()=>onSession(session),0)});
  const {data:{session}}=await sb.auth.getSession();onSession(session);
})();
})();
</script>

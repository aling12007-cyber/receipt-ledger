<body>
<div class="wrap" id="authView" hidden>
  <div class="sheet pad stack" style="max-width:420px;margin:8vh auto 0">
    <div class="brand"><div class="stamp" aria-hidden="true">帳</div><div><div class="eyebrow" data-i18n="eyebrow"></div><h1>Receipt Ledger</h1></div></div>
    <div class="langsw" role="group" aria-label="Language" style="align-self:flex-start">
      <button data-lang="en" aria-pressed="false">EN</button><button data-lang="ja" aria-pressed="false">日本語</button><button data-lang="zh" aria-pressed="false">中文</button>
    </div>
    <p class="muted small" style="margin:0" data-i18n="authSub"></p>
    <form id="authForm" class="stack" novalidate>
      <label class="f" for="aEmail"><span data-i18n="email"></span><input type="email" id="aEmail" autocomplete="email" required></label>
      <label class="f" for="aPass"><span data-i18n="password"></span><input type="password" id="aPass" autocomplete="current-password" minlength="8" required></label>
      <div class="row"><button class="btn primary" type="submit" id="aSubmit" data-i18n="signIn"></button><button class="btn ghost" type="button" id="aToggle" data-i18n="noAcct"></button></div>
      <p class="small" id="aMsg" style="margin:0"></p>
    </form>
  </div>
</div>
<div class="app" id="appView" hidden>
  <aside class="side" id="sideNav" aria-label="Menu">
    <div class="brand side-brand"><div class="stamp" aria-hidden="true">帳</div><div><div class="eyebrow" data-i18n="eyebrow"></div><b class="side-name" id="sideBiz">Receipt Ledger</b></div></div>
    <nav class="sidenav">
      <button data-tab="summary" data-i18n="navDash"></button>
      <div class="navgrp" data-i18n="navGrpDaily"></div>
      <button data-tab="scan" data-i18n="navReceipts"></button>
      <button data-tab="entry" data-i18n="tabEntry"></button>
      <button data-tab="invoices" data-i18n="navInvoices"></button>
      <div class="navgrp" data-i18n="navGrpMonthly"></div>
      <button data-tab="bank" data-i18n="navBank"></button>
      <div class="navgrp" data-i18n="navGrpBooks"></div>
      <button data-tab="journal" data-i18n="tabJournal"></button>
      <button data-tab="ledger" data-i18n="navLedger"></button>
      <button data-tab="tb" data-i18n="navTB"></button>
      <div class="navgrp" data-i18n="navGrpClose"></div>
      <button data-tab="filing" data-i18n="navFiling"></button>
      <div class="navgrp" data-i18n="navGrpFiling"></div>
      <button data-tab="return" data-i18n="navReturn"></button>
      <button data-tab="ctax" data-i18n="navCtax"></button>
      <div class="navgrp" data-i18n="navGrpSettings"></div>
      <button data-tab="settings" data-i18n="tabSettings"></button>
    </nav>
    <div class="side-foot">
      <div class="langsw" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="false">EN</button><button data-lang="ja" aria-pressed="false">日本語</button><button data-lang="zh" aria-pressed="false">中文</button>
      </div>
      <button class="btn ghost" id="sideSignOut" data-i18n="signOut"></button>
    </div>
  </aside>
  <div class="main wrap">
  <header class="top">
    <div class="brand">
      <div class="stamp" aria-hidden="true">帳</div>
      <div>
        <div class="eyebrow" data-i18n="eyebrow"></div>
        <h1 id="bizName">Receipt Ledger</h1>
      </div>
    </div>
    <div class="toolbar">
      <div class="langsw" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="ja" aria-pressed="false">日本語</button>
        <button data-lang="zh" aria-pressed="false">中文</button>
      </div>
      <button class="btn ghost" id="signOut" data-i18n="signOut"></button>
      <label class="f" for="yearSel"><span data-i18n="yearLabel"></span>
        <select id="yearSel"></select>
      </label>
    </div>
  </header>

  <h2 class="pagetitle" id="pageTitle"></h2>

  <div id="banners"></div>

  <section data-panel="scan" class="stack">
    <div class="drop" id="drop">
      <svg class="cam" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 16h8l4-6h12l4 6h8v24H6z" stroke-linejoin="round"/><circle cx="24" cy="27" r="8"/></svg>
      <span class="big" data-i18n="dropTitle"></span>
      <div class="pickrow">
        <label class="btn primary pick" for="camIn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="pickCam"></span></label>
        <label class="btn pick" for="fileIn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span data-i18n="pickLib"></span></label>
        <button type="button" class="btn pick" id="driveBtn" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 3h8l6 10.5-4 7H6l-4-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 3l6 10.5H2M16 3L10 13.5M22 13.5H10l-4 7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="pickDrive"></span></button>
      </div>
      <span class="muted small" data-i18n="dropSub"></span>
      <input type="file" id="camIn" accept="image/*" capture="environment">
      <input type="file" id="fileIn" accept="image/*,.heic,.heif,application/pdf,.pdf" multiple>
    </div>
    <div class="row">
      <button class="btn" id="manualExp" data-i18n="manualExp"></button>
      <button class="btn" id="manualInc" data-i18n="manualInc"></button>
    </div>
    <div class="sheet" id="queue" hidden></div>
    <p class="muted small" data-i18n="queueHint"></p>
  </section>

  <section data-panel="journal" hidden class="stack">
    <div class="note info" data-read="journal"></div>
    <div class="sheet">
      <div class="filters">
        <label class="f" for="fFrom"><span data-i18n="fFrom"></span><input type="date" id="fFrom"></label>
        <label class="f" for="fTo"><span data-i18n="fTo"></span><input type="date" id="fTo"></label>
        <label class="f" for="fMin"><span data-i18n="fMin"></span><input type="number" id="fMin" class="num" inputmode="numeric"></label>
        <label class="f" for="fMax"><span data-i18n="fMax"></span><input type="number" id="fMax" class="num" inputmode="numeric"></label>
        <label class="f" for="fQ"><span data-i18n="fQ"></span><input type="search" id="fQ" placeholder="Amazon"></label>
        <label class="f" for="fAcc"><span data-i18n="fAcc"></span><select id="fAcc"></select></label>
        <label class="f" for="fDoc"><span data-i18n="fDoc"></span><select id="fDoc"></select></label>
      </div>
      <div class="note info small" id="jOnlyBar" hidden style="margin:0 16px 8px"></div>
      <div class="row pad" style="justify-content:space-between">
        <span class="small muted" id="jCount"></span>
        <button class="btn" id="expJournal" data-i18n="expJournal"></button>
      </div>
      <div class="tablewrap">
        <table id="jTable" class="cards">
          <thead><tr><th data-i18n="thDate"></th><th data-i18n="thDr"></th><th class="r" data-i18n="thAmt"></th><th data-i18n="thCr"></th><th class="r" data-i18n="thAmt"></th><th data-i18n="thDesc"></th><th data-i18n="thQual"></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <section data-panel="ledger" hidden class="stack">
    <div class="note info" data-read="ledger"></div>
    <div class="sheet">
      <div class="filters">
        <label class="f" for="glAcc"><span data-i18n="qeAccount"></span><select id="glAcc"></select></label>
        <label class="f" for="glFrom"><span data-i18n="fFrom"></span><input type="date" id="glFrom"></label>
        <label class="f" for="glTo"><span data-i18n="fTo"></span><input type="date" id="glTo"></label>
      </div>
      <div class="tablewrap"><table class="jtable cards" id="glTable">
        <thead><tr><th data-i18n="thDate"></th><th data-i18n="glCounter"></th><th data-i18n="thDesc"></th><th class="r" data-i18n="thDr"></th><th class="r" data-i18n="thCr"></th><th class="r" data-i18n="glBalance"></th></tr></thead>
        <tbody></tbody><tfoot></tfoot></table></div>
    </div>
    <div id="glNotes" class="stack" style="gap:8px"></div>
  </section>

  <section data-panel="tb" hidden class="stack">
    <div class="note info" data-read="tb"></div>
    <div class="sheet">
      <div class="filters">
        <label class="f" for="tbPeriod"><span data-i18n="tbPeriod"></span><select id="tbPeriod"></select></label>
        <label class="f tb-custom" for="tbFrom"><span data-i18n="fFrom"></span><input type="date" id="tbFrom"></label>
        <label class="f tb-custom" for="tbTo"><span data-i18n="fTo"></span><input type="date" id="tbTo"></label>
        <div class="f" style="justify-content:flex-end"><button class="btn" id="expTB" data-i18n="expTB"></button></div>
      </div>
      <div class="tablewrap"><table class="jtable" id="tbTable">
        <thead><tr><th data-i18n="thAcc"></th><th class="r" data-i18n="tbOpening"></th><th class="r" data-i18n="thDr"></th><th class="r" data-i18n="thCr"></th><th class="r" data-i18n="tbClosing"></th></tr></thead>
        <tbody></tbody><tfoot></tfoot></table></div>
    </div>
    <div id="tbNotes" class="stack" style="gap:8px"></div>
  </section>

  <section data-panel="summary" hidden class="stack">
    <p class="small muted" id="srcNote" style="margin:0"></p>
    <div class="kpis">
      <div class="kpi"><div class="eyebrow" data-i18n="kSales"></div><div class="v" id="kSales">¥0</div></div>
      <div class="kpi"><div class="eyebrow" data-i18n="kExp"></div><div class="v" id="kExp">¥0</div></div>
      <div class="kpi" id="kIncWrap"><div class="eyebrow" data-i18n="kInc"></div><div class="v" id="kInc">¥0</div></div>
      <div class="kpi"><div class="eyebrow" id="kAfterLabel"></div><div class="v" id="kAfter">¥0</div></div>
    </div>
    <div class="sheet pad stack" id="taxCard"></div>
    <div class="grid2"><div class="sheet pad stack" id="todoCard"></div><div class="sheet pad stack" id="deadlineCard"></div></div>
    <div class="sheet pad stack">
      <div class="row" style="justify-content:space-between">
        <h2 data-i18n="monthly"></h2>
        <div class="legend"><span style="--c:var(--ai)" data-i18n="legSales"></span><span style="--c:var(--shu)" data-i18n="legExp"></span></div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="barlabels"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span></div>
    </div>
    <div class="sheet">
      <div class="row pad" style="justify-content:space-between">
        <div><h2 data-i18n="byAcc"></h2><p class="small muted" style="margin:0" id="byAccSub"></p></div>
        <button class="btn" id="expSummary" data-i18n="expSummary"></button>
      </div>
      <div class="tablewrap"><table id="accTable"><thead><tr><th data-i18n="thAcc"></th><th class="r" data-i18n="thCount"></th><th class="r" data-i18n="thAmt"></th><th class="r" data-i18n="thShare"></th></tr></thead><tbody></tbody><tfoot></tfoot></table></div>
    </div>
    <div class="sheet pad stack">
      <h2 data-i18n="ctaxTitle"></h2>
      <div class="tablewrap"><table id="ctaxTable"><thead><tr><th data-i18n="thClass"></th><th class="r" data-i18n="th10"></th><th class="r" data-i18n="th8"></th></tr></thead><tbody></tbody></table></div>
      <p class="small muted" id="ctaxNote" style="margin:0"></p>
    </div>
  </section>

  <section data-panel="return" hidden class="stack">
    <div class="note info" data-i18n="rtIntro"></div>
    <div class="sheet pad stack" id="rtBiz"></div>
    <div class="sheet pad stack"><h2 data-i18n="rtAnswers"></h2><p class="small muted" style="margin:0" data-i18n="rtAnswersSub"></p><div id="rtForm" class="stack"></div></div>
    <div class="sheet pad stack" id="rtResult"></div>
    <div class="sheet pad stack" id="etaxCard"></div>
    <div class="sheet pad stack"><h2 data-i18n="rtSteps"></h2><p class="small muted" style="margin:0" data-i18n="rtStepsSub"></p><div id="rtSteps" class="stack"></div>
      <div class="row"><a class="btn primary" href="https://www.keisan.nta.go.jp/" target="_blank" rel="noopener" data-i18n="rtOpenNta"></a></div></div>
  </section>

  <section data-panel="bank" hidden class="stack">
    <div class="sheet pad stack">
      <h2 data-i18n="bkTitle"></h2>
      <p class="small muted" style="margin:0" data-i18n="bkSub"></p>
      <div class="grid">
        <label class="f" for="bkKind"><span data-i18n="bkKind"></span><select id="bkKind"></select></label>
        <label class="f" for="bkVia"><span data-i18n="bkVia"></span><select id="bkVia"></select></label>
        <label class="f span2" for="bkFile"><span data-i18n="bkFile"></span><input id="bkFile" type="file" accept=".csv,.txt,text/csv"></label>
      </div>
      <p class="small" style="margin:0" id="bkMsg"></p>
    </div>
    <div class="sheet pad stack" id="bkResult" hidden></div>
  </section>
  <section data-panel="invoices" hidden class="stack">
    <div class="sheet pad stack" id="invList"></div>
    <div class="sheet pad stack" id="invEdit" hidden></div>
    <div class="sheet pad stack" id="invIssuer"></div>
  </section>
  <section data-panel="ctax" hidden class="stack">
    <div class="note info" data-i18n="ctIntro"></div>
    <div class="sheet pad stack"><h2 data-i18n="ctQuestions"></h2><div id="ctForm" class="grid"></div></div>
    <div class="sheet pad stack"><h2 data-i18n="ctFigures"></h2><div id="ctFigures"></div></div>
    <div id="ctBanner"></div>
    <div id="ctMethods" class="kpis"></div>
    <div class="sheet pad stack" id="ctGuide"></div>
  </section>

  <section data-panel="filing" hidden class="stack">
    <div class="sheet pad stack" id="closingCard"></div>
    <div class="sheet pad stack">
      <div class="row" style="justify-content:space-between"><h2 data-i18n="fiStatus"></h2><button class="btn" id="expFiling" data-i18n="expFiling"></button></div>
      <div class="checklist" id="fStatus"></div>
    </div>
    <div class="sheet">
      <div class="pad stack" style="gap:6px"><h2 id="plTitle"></h2><p class="small muted" style="margin:0" data-i18n="plSub"></p><p class="small" style="margin:0" id="plNotes"></p></div>
      <div class="tablewrap"><table id="fPL" class="form-table"><tbody></tbody></table></div>
    </div>
    <div class="sheet pad stack">
      <h2 data-i18n="p2Title"></h2>
      <div class="tablewrap"><table id="fMonthly" class="form-table"><thead><tr><th data-i18n="thMonth"></th><th class="r">売上（収入）金額</th><th class="r">仕入金額</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div>
      <h3>地代家賃の内訳</h3>
      <div class="tablewrap"><table id="fRent" class="form-table"><thead><tr><th>支払先</th><th class="r">本年中の賃借料</th><th class="r">左の賃借料のうち必要経費算入額</th></tr></thead><tbody></tbody></table></div>
    </div>
    <div class="sheet pad stack">
      <h2 data-i18n="p3Title"></h2>
      <p class="small muted" style="margin:0" data-i18n="p3Sub"></p>
      <div id="fBig"></div>
      <div class="tablewrap"><table id="fDep" class="form-table"><thead><tr><th>名称</th><th>取得年月</th><th class="r">取得価額</th><th>償却方法</th><th class="r">耐用年数</th><th class="r">償却率</th><th class="r">本年中の償却期間</th><th class="r">本年分の償却費</th><th class="r">事業専用割合</th><th class="r">本年分の必要経費算入額</th><th class="r">未償却残高（期末）</th><th></th></tr></thead><tbody></tbody><tfoot></tfoot></table></div>
      <details id="assetBox"><summary class="btn" style="display:inline-flex" data-i18n="aAddOpen"></summary>
        <div class="stack" style="margin-top:12px">
          <div class="grid">
            <label class="f span2" for="aName"><span data-i18n="aName"></span><input id="aName" placeholder="MacBook Pro 14"></label>
            <label class="f" for="aPreset"><span data-i18n="aPreset"></span><select id="aPreset"></select></label>
            <label class="f" for="aDate"><span data-i18n="aDate"></span><input type="month" id="aDate"></label>
            <label class="f" for="aCost"><span data-i18n="aCost"></span><input type="number" inputmode="numeric" class="num" id="aCost"></label>
            <label class="f" for="aMethod"><span data-i18n="aMethod"></span><select id="aMethod"></select></label>
            <label class="f" for="aLife"><span data-i18n="aLife"></span><input type="number" min="2" max="50" class="num" id="aLife"></label>
            <label class="f" for="aRatio"><span data-i18n="aRatio"></span><input type="number" min="0" max="100" class="num" id="aRatio" value="100"></label>
            <label class="f" for="aPaid"><span data-i18n="aPaid"></span><select id="aPaid"></select></label>
          </div>
          <div class="row"><button class="btn primary" id="aSave"></button><button class="btn ghost" id="aCancel" data-i18n="cancel" hidden></button><span class="small" id="aMsg"></span></div>
        </div>
      </details>
    </div>
    <div class="sheet pad stack" id="bsBox">
      <h2 data-i18n="p4Title"></h2>
      <p class="small muted" style="margin:0" data-i18n="p4Sub"></p>
      <div class="bsinputs">
        <div class="stack" style="gap:8px"><h3 data-i18n="bsOpen"></h3><div class="small" id="bsOpenMode"></div><div class="grid" id="bsOpenIn"></div></div>
        <div class="stack" style="gap:8px"><h3 data-i18n="bsCloseReal"></h3><p class="small muted" style="margin:0" data-i18n="bsCloseRealSub"></p><div class="grid" id="bsCloseIn"></div></div>
      </div>
      <p class="small" id="bsMsg" style="margin:0"></p>
      <div class="tablewrap"><table id="fBS" class="form-table"><thead><tr><th>科目</th><th class="r">1月1日（期首）</th><th class="r">12月31日（期末）</th></tr></thead><tbody></tbody></table></div>
      <div class="small" id="bsAdj"></div>
    </div>
    <div class="sheet pad stack" id="precheckCard"></div>
    <div class="sheet pad stack">
      <h2 data-i18n="stepsTitle"></h2>
      <ol class="small notes" id="fSteps" style="margin:0;padding-left:1.3em"></ol>
    </div>
  </section>

  <section data-panel="entry" hidden class="stack">
    <div class="sheet pad stack">
      <div><h2 data-i18n="qeTitle"></h2><p class="small muted" style="margin:4px 0 0" data-i18n="qeSub"></p></div>
      <div class="seg" role="radiogroup" id="qeType">
        <button type="button" role="radio" data-qtype="expense" aria-checked="true" data-i18n="qeExpense"></button>

<script>
(function(){
// ===== i18n =====
const I18N=window.I18N;
// Account names stay Japanese (that's what the tax forms use); a translation is shown beside them in EN / 中文.
const ACC_TR={
 "旅費交通費":["Travel & transport","交通費"],"通信費":["Communication","通訊費"],"消耗品費":["Supplies","消耗品"],"会議費":["Meetings","會議費"],"接待交際費":["Entertainment","交際費"],
 "新聞図書費":["Books & subscriptions","書報費"],"広告宣伝費":["Advertising","廣告費"],"支払手数料":["Fees & commissions","手續費"],"外注工賃":["Outsourcing","外包費"],"地代家賃":["Rent","房租"],
 "水道光熱費":["Utilities","水電瓦斯"],"荷造運賃":["Shipping","運費"],"研修費":["Training","研修費"],"修繕費":["Repairs","修繕費"],"損害保険料":["Insurance","保險費"],"租税公課":["Taxes & dues","稅捐規費"],
 "福利厚生費":["Welfare","福利費"],"給料賃金":["Wages","薪資"],"利子割引料":["Interest","利息"],"減価償却費":["Depreciation","折舊"],"仕入高":["Purchases (goods for resale)","進貨成本"],"雑費":["Miscellaneous","雜費"],
 "事業主借":["Owner's contribution","業主借入"],"現金":["Cash","現金"],"普通預金":["Bank account","銀行存款"],"未払金":["Payable (card)","應付款"],"売掛金":["Receivable","應收帳款"],"事業主貸":["Owner's drawings","業主提領"],"売上高":["Sales","營業收入"]};
let lang="ja";
try{const s=localStorage.getItem("lang");if(s&&I18N[s])lang=s;else lang="ja"}catch(e){} // Japanese is the primary language
const t=(k,v)=>{let s=(I18N[lang][k]??I18N.en[k]??k);if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s};
const accText=a=>{if(lang==="ja"||!ACC_TR[a])return a;return ACC_TR[a][lang==="en"?0:1]+" · "+a};
const accHTML=a=>{if(lang==="ja"||!ACC_TR[a])return esc(a);return esc(ACC_TR[a][lang==="en"?0:1])+`<span class="jp">${esc(a)}</span>`};

const NON_EXPENSE=["事業主借","現金","普通預金","未払金","売掛金","事業主貸","売上高"];
const EXPENSE_ACCOUNTS=Object.keys(ACC_TR).filter(a=>!NON_EXPENSE.includes(a));
const CREDIT_ACCOUNTS=["事業主借","現金","普通預金","未払金"];
const INCOME_DEBIT=["普通預金","売掛金","現金","事業主貸"];
const yen=n=>{const v=Math.round(n||0);return (v<0?"-¥":"¥")+Math.abs(v).toLocaleString("ja-JP")};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const isQualified=no=>/^T\d{13}$/.test(String(no||"").replace(/[\s-]/g,""));
const opts=(arr,sel,lab)=>arr.map(a=>`<option value="${esc(a)}" ${a===sel?"selected":""}>${esc(lab?lab(a):a)}</option>`).join("");

let sb=null,uid=null,aiEnabled=false,googleCfg=null;
let driveReturn=(typeof Imports!=="undefined")?Imports.handleRedirect():null;const sample=true,canImages=true;
let entries=[];
let settings={name:"",filing:"blue65",ctax:"exempt",cash:"事業主借",card:"事業主借",cardV:3,shogaku:"0",hint:""};
const DEDUCT={blue65:650000,blue55:550000,blue10:100000,white:0};
const queue=[];
const now=new Date();let year=now.getFullYear();
const isBlue=()=>settings.filing!=="white";

// ===== static text =====
function applyLang(){
  document.documentElement.lang=lang==="zh"?"zh-Hant":lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll("[data-read]").forEach(el=>el.textContent=Tips.read(el.dataset.read,lang));
  const qt=$("#qeTips");if(qt)delete qt.dataset.html;
  document.querySelectorAll(".langsw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#lawList").innerHTML=t("law").map(x=>`<li>${x}</li>`).join("");
  $("#imgViewImg").alt=t("receiptImg");
  const fd=$("#fDoc").value;$("#fDoc").innerHTML=opts(["","has","none"],fd,k=>t(k?"fDoc_"+k:"all"));
  const fa=$("#fAcc").value;$("#fAcc").innerHTML=`<option value="">${t("all")}</option>`+opts([...EXPENSE_ACCOUNTS,"売上高"],fa,accText);
  $("#pageTitle").textContent=t(PAGES[curTab]);entryOptions();
  fillSettings();fillYears();renderBanners();renderQueue();render();
}
document.querySelectorAll(".langsw button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(e){}applyLang()});

let tTimer;
function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>el.hidden=true,2600)}
const bannerState=[];// {key,kind,extra}
function banner(key,kind,extra){bannerState.push({key,kind,extra:extra||""});renderBanners()}
function renderBanners(){$("#banners").innerHTML=bannerState.map(b=>`<div class="banner ${b.kind}">${esc(t(b.key)+b.extra)}</div>`).join("")}

// ===== navigation: sidebar (wide screens), bottom bar + slide-in menu (phones); routes #/<page> =====
const PAGES={summary:"navDash",entry:"tabEntry",journal:"tabJournal",ledger:"navLedger",tb:"navTB",scan:"navReceipts",filing:"navFiling",settings:"tabSettings",eval:"evTitle",return:"navReturn",ctax:"navCtax",bank:"navBank",invoices:"navInvoices"};
let curTab="summary";
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{showTab(b.dataset.tab);closeMenu()}));
function showTab(tb,fromHash){
  if(!PAGES[tb])tb="summary";
  curTab=tb;
  document.querySelectorAll("[data-tab]").forEach(b=>{if(b.dataset.tab===tb)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  document.querySelectorAll("[data-panel]").forEach(p=>p.hidden=p.dataset.panel!==tb);
  $("#pageTitle").textContent=t(PAGES[tb]);
  try{localStorage.setItem("tab",tb)}catch(e){}
  if(!fromHash&&location.hash!=="#/"+tb)history.pushState(null,"","#/"+tb);
  render();
}
window.addEventListener("popstate",()=>{const m=location.hash.match(/^#\/(\w+)/);if(m)showTab(m[1],true)});
function openMenu(){$("#sideNav").classList.add("open");$("#navScrim").hidden=false;$("#menuBtn").setAttribute("aria-expanded","true")}
function closeMenu(){$("#sideNav").classList.remove("open");$("#navScrim").hidden=true;$("#menuBtn").setAttribute("aria-expanded","false")}
$("#menuBtn").onclick=()=>$("#sideNav").classList.contains("open")?closeMenu():openMenu();
$("#navScrim").onclick=closeMenu;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

function fillYears(){
  const ys=new Set([now.getFullYear(),now.getFullYear()-1]);entries.forEach(e=>e.date&&ys.add(+e.date.slice(0,4)));
  const arr=[...ys].filter(Boolean).sort((a,b)=>b-a);
  $("#yearSel").innerHTML=arr.map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}${lang==="en"?"":"年"} (${t("era")} ${y-2018})</option>`).join("");
}
$("#yearSel").addEventListener("change",e=>{year=+e.target.value;render();loadBooks()});

// ===== bookkeeping =====
const {totalOf,ratioOf,bizOf,linesOf}=Books; // books.js: shared with tests/
const receiptTotal=e=>e.assetId?entries.filter(x=>x.assetId===e.assetId).reduce((s,x)=>s+totalOf(x),0)||totalOf(e):totalOf(e);
const qualOK=e=>isQualified(e.invoiceNo)||(settings.shogaku==="1"&&receiptTotal(e)<10000);

// ===== entry form =====
const LINE_KEYS=["debit","items","amt10","amt8","amt0","memo"];
const isSplit=d=>Array.isArray(d.split)&&d.split.length>=2;
function splitHTML(d,p){
  const cell=(i,k,lab,inner)=>`<label class="f" for="${p}_s${i}_${k}"><span>${t(lab)}</span>${inner}</label>`;
  const num=(i,k,v)=>`<input type="number" inputmode="numeric" class="num" id="${p}_s${i}_${k}" data-s="${i}:${k}" value="${v||""}">`;
  return `<div class="split-lines">${d.split.map((l,i)=>`<div class="split-line">
    <div class="split-head"><b>${t("lineN",{n:i+1})}</b><button type="button" class="btn ghost small" data-delline="${i}" aria-label="${esc(t("delLine"))}">×</button></div>
    <div class="grid">
      ${cell(i,"debit","debitExp",`<select id="${p}_s${i}_debit" data-s="${i}:debit">${opts(EXPENSE_ACCOUNTS,l.debit,accText)}</select>`)}
      <label class="f span2" for="${p}_s${i}_items"><span>${t("items")}</span><input id="${p}_s${i}_items" data-s="${i}:items" value="${esc(l.items)}" data-auto="${esc(l.itemsAuto||"")}"></label>
      ${cell(i,"amt10","a10",num(i,"amt10",l.amt10))}${cell(i,"amt8","a8",num(i,"amt8",l.amt8))}${cell(i,"amt0","a0",num(i,"amt0",l.amt0))}
      <label class="f span2" for="${p}_s${i}_memo"><span>${t("memo")}</span><input id="${p}_s${i}_memo" data-s="${i}:memo" value="${esc(l.memo)}"></label>
    </div></div>`).join("")}
    <button type="button" class="btn ghost small" data-addline>${t("addLine")}</button></div>`;
}
function formHTML(d,p,o){
  if(isSplit(d)&&d.type!=="income") return formSplitHTML(d,p);
  const inc=d.type==="income";const id=k=>p+"_"+k;
  const num=k=>`<input type="number" inputmode="numeric" class="num" id="${id(k)}" data-k="${k}" value="${d[k]||""}">`;
  return `<div class="grid">
    <label class="f" for="${id("date")}">${t("date")}<input type="date" id="${id("date")}" data-k="date" value="${esc(d.date)}"></label>
    <label class="f span2" for="${id("vendor")}">${t(inc?"client":"vendor")}<input id="${id("vendor")}" data-k="vendor" value="${esc(d.vendor)}"></label>
    ${inc?"":`<label class="f" for="${id("invoiceNo")}">${t("regNo")}<input id="${id("invoiceNo")}" data-k="invoiceNo" value="${esc(d.invoiceNo)}" placeholder="T1234567890123"></label>`}
    <label class="f span2" for="${id("items")}">${t("items")}<input id="${id("items")}" data-k="items" value="${esc(d.items)}" data-auto="${esc(d.itemsAuto||"")}"></label>
    <label class="f" for="${id("amt10")}">${t("a10")}${num("amt10")}</label>
    <label class="f" for="${id("amt8")}">${t("a8")}${num("amt8")}</label>
    <label class="f" for="${id("amt0")}">${t("a0")}${num("amt0")}</label>
    <label class="f" for="${id("debit")}">${t(inc?"debitInc":"debitExp")}<select id="${id("debit")}" data-k="debit">${opts(inc?INCOME_DEBIT:EXPENSE_ACCOUNTS,d.debit,accText)}</select></label>
    ${inc?"":`<label class="f" for="${id("credit")}">${t("credit")}<select id="${id("credit")}" data-k="credit">${opts(CREDIT_ACCOUNTS,d.credit,accText)}</select></label>
    <label class="f" for="${id("bizRatio")}">${t("ratio")}<input type="number" min="0" max="100" class="num" id="${id("bizRatio")}" data-k="bizRatio" value="${d.bizRatio??100}"></label>`}
    <label class="f span2" for="${id("memo")}">${t("memo")}<input id="${id("memo")}" data-k="memo" value="${esc(d.memo)}"></label>
  </div>${o&&o.splittable&&!inc?`<div style="margin-top:8px"><button type="button" class="btn ghost small" data-splitbtn>${t("splitBtn")}</button></div>`:""}${tipsBox()}<div class="small muted" style="margin-top:12px">${esc(t("jPreview"))}</div><div class="preview-lines" data-preview style="margin-top:4px"></div>`;
}
// One receipt, several accounts: shared fields once, then one block per account line.
function formSplitHTML(d,p){
  const id=k=>p+"_"+k;
  return `<div class="grid">
    <label class="f" for="${id("date")}">${t("date")}<input type="date" id="${id("date")}" data-k="date" value="${esc(d.date)}"></label>
    <label class="f span2" for="${id("vendor")}">${t("vendor")}<input id="${id("vendor")}" data-k="vendor" value="${esc(d.vendor)}"></label>

// The processed copy (shown on screen, sent to AI reading): at most 1568 px, turned and deskewed. The original file is kept as it is.
async function downscale(file,pre){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));let c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    if(pre&&(pre.angle||pre.turns))c=DocPreprocess.rotateCanvas(c,pre.angle||0,pre.turns||0);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));}finally{URL.revokeObjectURL(url)}
}
// Image quality (DocQuality) of a photo, measured on a 1400 px copy
async function measureQuality(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d",{willReadFrequently:true}).drawImage(img,0,0,c.width,c.height);
    return DocQuality.analyze({...DocPreprocess.fromCanvas(c),originalWidth:img.naturalWidth,originalHeight:img.naturalHeight});
  }finally{URL.revokeObjectURL(url)}
}

async function cropBlob(blob,bbox){
  const url=URL.createObjectURL(blob);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const W=img.naturalWidth,H=img.naturalHeight,py=bbox.height*1.2,px=bbox.height*3;
    const x0=Math.max(0,(bbox.x-px)*W),y0=Math.max(0,(bbox.y-py)*H),x1=Math.min(W,(bbox.x+bbox.width+px)*W),y1=Math.min(H,(bbox.y+bbox.height+py)*H);
    const k=Math.min(3,Math.max(1,400/(x1-x0)));const c=document.createElement("canvas");c.width=Math.round((x1-x0)*k);c.height=Math.round((y1-y0)*k);
    c.getContext("2d").drawImage(img,x0,y0,x1-x0,y1-y0,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.9));}finally{URL.revokeObjectURL(url)}
}

    body:JSON.stringify({mode:"field",field,ocrValue,image:await blobToB64(crop),mediaType:"image/jpeg"})});
  if(!res.ok)throw new Error("HTTP "+res.status);

// entries posted straight into the books (入金・支払・振替) move cash, bank, receivables… but are not records
const manualByYear={};
const isManualPost=e=>e.source!=="migrated"&&e.status==="posted";
const manualPosts=y=>(manualByYear[y]||(books.year===y?books.entries.filter(isManualPost):[])).map(e=>({date:e.date,lines:e.lines}));
function firstDataYear(){
  const ys=[...entries.map(e=>+String(e.date||"").slice(0,4)).filter(Boolean),...Object.keys(settings.bs||{}).filter(k=>{const o=(settings.bs[k]||{}).open;return o&&filled(o)&&!settings.bs[k].openAuto}).map(Number),
    ...assetsList().map(a=>+String(a.date||"").slice(0,4)).filter(Boolean)];
  return ys.length?Math.min(...ys):null;
}
const hasPrior=y=>{const f=firstDataYear();return f!=null&&f<y};
function priorYears(y){const f=firstDataYear();const out=[];if(f!=null)for(let k=f;k<y;k++)out.push(k);return out}
function bsOfYear(y){
  const b=(settings.bs||{})[String(y)]||{open:{},close:{}},dep=Filing.depreciation(assetsList(),y);
  return Filing.balanceSheet({entries,year:y,linesOf,open:b.open||{},close:b.close||{},dep,income:0,extra:manualPosts(y)});
}
// Each year from the first year with records: unless the user typed that year's opening balances, they are last year's
// closing balances. Stored in settings (openAuto) so the books get the same opening entry. Returns true when anything changed.
function carryForward(){
  const f=firstDataYear();if(f==null)return false;
  settings.bs=settings.bs||{};
  const last=Math.max(year,new Date().getFullYear());
  let changed=false;
  for(let y=f+1;y<=last;y++){
    const k=String(y),cur=settings.bs[k]||(settings.bs[k]={open:{},close:{}});
    if(cur.openMode==="manual")continue;
    if(filled(cur.open)&&!cur.openAuto&&cur.openMode!=="auto")continue;     // typed before this feature: keep
    const c=bsOfYear(y-1).carry,open={};
    for(const [key] of BS_OPEN){const v=Math.round(c[key]||0);if(v)open[key]=v}
    if(JSON.stringify(open)!==JSON.stringify(cur.open||{})||!cur.openAuto){cur.open=open;cur.openAuto=true;changed=true}
  }
  if(changed)saveSoon();
  return changed;
}

// ===== offline: receipts wait on this device (IndexedDB) until they are saved; the app shell is cached by sw.js =====
const Pending={
  db:null,
  open(){if(this.db)return this.db;this.db=new Promise((res,rej)=>{try{const r=indexedDB.open("rl-pending",1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},
  async tx(mode,fn){try{const db=await this.open();return await new Promise((res,rej)=>{const t2=db.transaction("files",mode),st=t2.objectStore("files");const out=fn(st);t2.oncomplete=()=>res(out&&out.result);t2.onerror=()=>rej(t2.error)})}catch(e){return null}},
  put(id,f){if(!uid)return;return this.tx("readwrite",st=>st.put({id,uid,name:f.name||"receipt",type:f.type||"",blob:f,added:Date.now()}))},
  del(id){return this.tx("readwrite",st=>st.delete(id))},
  all(){return this.tx("readonly",st=>st.getAll())},
};
async function restorePending(){
  const list=((await Pending.all())||[]).filter(x=>x.uid===uid&&!queue.some(q=>q.id===x.id));
  if(!list.length)return;
  const files=list.map(x=>{const f=new File([x.blob],x.name,{type:x.type||x.blob.type||""});f.pendingId=x.id;return f});
  addFiles(files,{restored:true});toast(t("offRestored",{n:files.length}));
}

// ===== 按分 memory: the business share last used for this shop (and account) =====
function lastRatio(vendor,debit){
  const n=DocMerchant.normalize(vendor||"").normalized;if(!n)return null;
  const hit=entries.filter(e=>e.type!=="income"&&DocMerchant.normalize(e.vendor||"").normalized===n&&(!debit||e.debit===debit)&&e.bizRatio!=null)
    .sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||""))[0];
  return hit&&+hit.bizRatio<100?+hit.bizRatio:null;   // only a remembered split; 100% is the default anyway
}
// ===== a scanned receipt for something already booked from a statement (or a recurring entry) =====
function statementMatch(d){
  const amt=totalOf(d);if(!amt||!d.date)return null;
  const day=s=>Date.parse(s+"T00:00:00Z")/864e5;
  return entries.filter(e=>e.type!=="income"&&!e.assetId&&totalOf(e)===amt&&Math.abs(day(e.date)-day(d.date))<=3)
    .sort((a,b)=>Math.abs(day(a.date)-day(d.date))-Math.abs(day(b.date)-day(d.date))||(String(b.id).startsWith("bank-")?1:0)-(String(a.id).startsWith("bank-")?1:0))[0]||null;
}
function attachNote(q){

  if(!m)return learned;

function confirmTwice(btn,label){if(btn.dataset.armed){delete btn.dataset.armed;return true}btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},4000);return false}
// 入金消込: 普通預金 (+ 振込手数料) / 売掛金, posted to the double-entry books
async function payInvoice(id,o,quiet){
  const v=invList().find(x=>x.id===id);if(!v)throw {message:"invoice?"};
  if(!o.date||!(o.amount>0))throw {message:t("invPayNeed")};
  const svc=LedgerService.create(sb);
  if(!(await svc.isAvailable()))throw {message:t("upNoTables")};
  const q=Invoices.paymentEntry(v,o),res=Journal.fromQuickEntry(q,{});
  const val=Journal.validate(res.entry);if(!val.ok)throw {message:t("qeInvalid")+val.errors.map(e=>e.code).join(", ")};
  await svc.post(res.entry,{key:"inv-pay-"+v.id,source:"manual"});
  v.status="paid";v.paidDate=o.date;v.paidAmount=Math.round(o.amount);v.fee=q.fee;
  await persistSettings();loadBooks();
  if(!quiet)toast(t("invPaidToast"));
}

function computeTodos(){
  const ys=yearEntries(),exp=ys.filter(e=>e.type!=="income"),out=[];
  const m=new Date().getMonth()+1;
  if(recurringPending.length)out.push({n:recurringPending.length,key:"tdRecurring",act:"recurring"});
  const big=Filing.bigItems(entries,year);if(big.length)out.push({n:big.length,key:"tdBig",tab:"filing"});
  if(settings.ctax==="general"){const nq=exp.filter(e=>!qualOK(e)&&(+e.amt10||0)+(+e.amt8||0)>=10000).length;if(nq)out.push({n:nq,key:"tdNoInvoice",tab:"journal"})}
  const nv=exp.filter(e=>!(e.vendor||"").trim()).length;if(nv)out.push({n:nv,key:"tdNoVendor",tab:"journal"});
  const inv=(settings.invoices||[]).filter(x=>x.status!=="paid"&&x.due&&x.due<todayStr()).length;if(inv)out.push({n:inv,key:"tdOverdue",tab:"invoices"});
  if(m>=12||m<=3){const c=closingItems();const done=c.filter(x=>x.done).length;if(done<c.length)out.push({n:`${done}/${c.length}`,key:"tdClosing",tab:"filing"})}
  if((m<=3||m>=11)&&!Object.keys(taxInput()).length)out.push({n:"",key:"tdReturn",tab:"return"});
  if(!settings.setupDone)out.unshift({n:"",key:"tdSetup",act:"setup"});
  {const ny=new Date().getFullYear()+(m>=12?1:0);if((m>=12||ny>rulesUpTo())&&!(settings.rulesChecked||{})[ny])out.push({n:"",key:"tdRules",tab:"settings",y:ny})}
  if(!backupRecent())out.push({n:"",key:"tdBackup",tab:"settings"});
  if(settings.ctax&&settings.ctax!=="exempt"){try{const {r}=ctaxResult(),ch=chosenMethod(r),b=r.methods.find(m=>m.key===r.best);if(b&&ch&&ch.key!==b.key&&ch.total>b.total)out.push({n:yen(ch.total-b.total),key:"tdCtax",tab:"ctax"})}catch(e){/* no figures yet */}}
  return out;
}

async function loadBooks(){

    if(!(await svc().isAvailable())){books.available=false;return}
    books.available=true;books.entries=await svc().list(year);books.year=year;
    manualByYear[year]=books.entries.filter(isManualPost);

}

// → { q, res (Journal result), row (record to save, expense/sale only), lines (what will be posted) }
function buildEntry(){
  const q=readEntry();
  if(!q.amount||q.amount<=0||!q.date)return {q};
  if(qeType==="transfer"&&q.from===q.to)return {q,error:"qeSameAcc"};
  const res=Journal.fromQuickEntry(q,{guess:(v,x)=>ReceiptOCR.guessAccount(v+" "+x,x),learned:learnedAccount});
  if(qeType!=="expense"&&qeType!=="sale")return {q,res,lines:res.entry.lines};
  const acc=qeType==="sale"?"売上高":res.suggestions[0].value;
  const code=qeType==="sale"?res.entry.lines.find(l=>l.account==="売上高").tax_code:res.suggestions[1].value;
  const bucket=/10$/.test(code)?"amt10":/8$/.test(code)?"amt8":"amt0";
  const row={type:qeType==="sale"?"income":"expense",date:q.date,vendor:q.vendor,invoiceNo:q.invoiceNo,amt10:0,amt8:0,amt0:0,[bucket]:q.amount,
    debit:qeType==="sale"?q.payment:acc,credit:qeType==="sale"?"売上高":q.payment,bizRatio:qeType==="sale"?100:Math.min(100,Math.max(0,q.bizRatio)),
    items:(qeType==="sale"||(acc==="会議費"&&q.description)?"":ReceiptOCR.summaryFor(acc,q.description+" "+q.vendor))||q.description,memo:q.description};
  const asset=res.notes.some(n=>/^fixedAsset/.test(n));
  return {q,res,row,asset,lines:asset?res.entry.lines:Migrate.rowLines(row,Books)};
}

// ===== sync with the double-entry books: old rows → journal (new / changed → reversal + new / deleted → reversal) =====
let syncState={running:false,again:false,timer:null};
async function syncBooks(manual){
  if(!sb||!uid)return null;
  if(syncState.running){syncState.again=true;return null}
  syncState.running=true;
  try{
    if(!(await LedgerService.create(sb).isAvailable()))return {missing:true};
    const r=await Sync.run(sb,entries,settings,{Books,Filing});
    const stale=(r.removedPaths||[]).filter(p=>!entries.some(e=>e.assetId===p));
    if(stale.length)await sb.storage.from("receipts").remove(stale);
    return r;
  }finally{syncState.running=false;if(syncState.again){syncState.again=false;scheduleSync()}}
}
// after every save / delete / load, quietly bring the books in step; problems show as a banner
function syncBanner(text){for(let i=bannerState.length-1;i>=0;i--)if(bannerState[i].key==="bSync")bannerState.splice(i,1);if(text)bannerState.push({key:"bSync",kind:"warn",extra:text});renderBanners()}
function scheduleSync(){
  clearTimeout(syncState.timer);
  syncState.timer=setTimeout(async()=>{
    try{const r=await syncBooks(false);if(r){books.ok=!r.missing&&!!r.ok;syncBanner(!r.missing&&!r.ok?t("upMismatch",{list:r.diffs.slice(0,6).map(d=>d.key).join("、")}):"");loadBooks()}}
    catch(e){syncBanner(e.code==="SQL_OUTDATED"?t("upOutdated"):t("upSyncFail")+(e.message||e))}
  },1200);
}

  const btn=$("#upgradeBtn"),msg=$("#upMsg"),det=$("#upDetail");

    $("#bsOpenIn").innerHTML=BS_OPEN.map(([k,l])=>inp("open",k,l)).join("");
    $("#bsCloseIn").innerHTML=BS_CLOSE.map(([k,l])=>inp("close",k,l)).join("");
  }
  const rowsOf=(a,c,head)=>`<tr class="head"><td colspan="3">${head}</td></tr>`+a.map((r,i)=>`<tr class="${r[1]||c[i][1]?"":"zero"}"><td>${esc(r[0])}</td><td class="r num">${yen(r[1])}</td><td class="r num">${yen(c[i][1])}</td></tr>`).join("");
  $("#fBS tbody").innerHTML=rowsOf(bs.assetsOpen,bs.assetsClose,"資産の部")
    +`<tr class="sum"><td>合計</td><td class="r num">${yen(bs.totals.assetsOpen)}</td><td class="r num">${yen(bs.totals.assetsClose)}</td></tr>`
    +rowsOf([...bs.liabOpen,...bs.capOpen],[...bs.liabClose,...bs.capClose],"負債・資本の部")
    +`<tr class="sum"><td>合計</td><td class="r num">${yen(bs.totals.liabOpen)}</td><td class="r num">${yen(bs.totals.liabClose)}</td></tr>`;
  const adj=[];
  if(bs.adj.bank<0)adj.push(t("bsAdjBankLess",{v:yen(-bs.adj.bank)}));
  if(bs.adj.bank>0)adj.push(t("bsAdjBankMore",{v:yen(bs.adj.bank)}));
  if(bs.adj.cash<0)adj.push(t("bsAdjCashLess",{v:yen(-bs.adj.cash)}));
  if(bs.adj.cash>0)adj.push(t("bsAdjCashMore",{v:yen(bs.adj.cash)}));
  $("#bsAdj").innerHTML=(bs.diff===0?`<span class="chip ok">${t("bsBalanced")}</span> `:`<span class="chip low">${t("bsDiff",{v:yen(bs.diff)})}</span> `)+`<span class="small muted">${esc(t(bs.closeAdjusted?"bsAdjusted":"bsAutoClose"))}</span> `+adj.map(esc).join(" ")+
    `<div class="small muted" style="margin-top:6px">${esc(t("bsCarryNext",{y:year+1}))}</div>`;
  // steps
  $("#fSteps").innerHTML=t("steps").map(x=>`<li>${x}</li>`).join("");
}

$("#aPreset").addEventListener("change",()=>{const p=Filing.PRESETS.find(x=>x.key===$("#aPreset").value);if(p&&p.life)$("#aLife").value=p.life});
function loadAsset(i){
  const a=assetsList()[i];if(!a)return;editingAsset=i;
  $("#assetBox").open=true;$("#aName").value=a.name;$("#aDate").value=a.date;$("#aCost").value=a.cost;$("#aLife").value=a.life||"";$("#aRatio").value=a.ratio??100;
  fillAssetForm();$("#aMethod").value=a.method;$("#aPaid").value=a.paidFrom||"事業主借";$("#aPreset").value=a.preset||"other";
  $("#assetBox").scrollIntoView({behavior:"smooth",block:"center"});
}
$("#aCancel").onclick=()=>{editingAsset=-1;["aName","aDate","aCost","aLife"].forEach(id=>$("#"+id).value="");$("#aRatio").value=100;$("#aMsg").textContent="";fillAssetForm()};
$("#aSave").onclick=async()=>{
  const msg=$("#aMsg");msg.style.color="var(--shu)";
  const a={id:editingAsset>=0?assetsList()[editingAsset].id:"a"+Date.now().toString(36),name:$("#aName").value.trim(),date:$("#aDate").value,cost:Math.round(+$("#aCost").value||0),
    method:$("#aMethod").value,life:Math.round(+$("#aLife").value||0),ratio:Math.min(100,Math.max(0,Math.round(+($("#aRatio").value||100)))),paidFrom:$("#aPaid").value,preset:$("#aPreset").value};
  a.cat=(Filing.PRESETS.find(p=>p.key===a.preset)||{}).cat||"工具器具備品";
  if(!a.name||!a.date||!a.cost){msg.textContent=t("aErrReq");return}
  if(a.cost<100000){msg.textContent=t("aErrCheap");return}
  if(a.method==="lump3"&&(a.cost<100000||a.cost>=200000)){msg.textContent=t("aErrLump");return}
  const lim=Filing.smallLimit(a.date);
  if(a.method==="small"&&(!isBlue()||a.cost>=lim)){msg.textContent=t("aErrSmall",{lim:lim.toLocaleString("ja-JP")});return}
  if(a.method==="sl"&&(a.life<2||a.life>50)){msg.textContent=t("aErrLife");return}
  if(editingAsset>=0)assetsList()[editingAsset]=a;else assetsList().push(a);
  const e=await persistSettings();
  if(e){msg.textContent=t("saveFail")+": "+e.message;return}
  msg.style.color="";msg.textContent=t("saved");$("#aCancel").onclick();renderFiling();
};
// export
$("#expFiling").onclick=()=>{
  const {dep,pl,bs}=filingCalc(),blue=isBlue();

  rows.push([],["3ページ 減価償却費の計算"],["名称","取得年月","取得価額","償却方法","耐用年数","償却率","本年中の償却期間","本年分の償却費","事業専用割合","本年分の必要経費算入額","未償却残高（期末）"]);
  dep.rows.forEach(r=>rows.push([r.name,r.date,r.cost,{sl:"定額法",lump3:"一括償却",small:"少額特例"}[r.method],r.method==="sl"?r.life:"",r.method==="sl"?r.rate:"",r.months+"/12",r.dep,r.ratio+"%",r.business,r.close]));
  if(blue){
    rows.push([],["4ページ 貸借対照表"],["科目","期首","期末"]);
    const both=(a,c)=>a.forEach((r,i)=>rows.push([r[0],r[1],c[i][1]]));
    rows.push(["資産の部"]);both(bs.assetsOpen,bs.assetsClose);rows.push(["合計",bs.totals.assetsOpen,bs.totals.assetsClose]);
    rows.push(["負債・資本の部"]);both([...bs.liabOpen,...bs.capOpen],[...bs.liabClose,...bs.capClose]);rows.push(["合計",bs.totals.liabOpen,bs.totals.liabClose]);
  }
  save(`${blue?"青色申告決算書":"収支内訳書"}_${year}.csv`,csv(rows));
};

{const m=location.hash.match(/^#\/(\w+)/);let tb=m&&m[1];try{tb=tb||localStorage.getItem("tab")}catch(e){}showTab(tb||"summary",true)}
applyLang();

// ===== Document AI Evaluation (internal test page): golden documents + what actual use shows =====
let evalResult=null,evalReal=null;
$("#evOpen").onclick=()=>showTab("eval");
$("#evRun").onclick=()=>{evalResult=null;renderEval(true)};
const pct=v=>v==null?"—":v.toFixed(1).replace(/\.0$/,"")+"%";
function evTiles(list){return `<div class="kpis">${list.map(([k,v,neg])=>`<div class="kpi${neg?" neg":""}"><div class="eyebrow">${esc(t(k))}</div><div class="v">${v}</div></div>`).join("")}</div>`}
function renderEval(force){
  if(!evalResult||force){
    const t0=performance.now();
    try{evalResult=DocEvaluate.run(DocGolden.CASES,{year:2026,today:"2026-10-03"})}catch(e){$("#evMsg").textContent=String(e&&e.message||e);return}
    $("#evMsg").textContent=t("evDone",{n:evalResult.metrics.cases,ms:Math.round(performance.now()-t0)});
  }
  const m=evalResult.metrics;
  $("#evMetrics").innerHTML=
    `<h3 style="margin:0">${esc(t("evFieldTitle"))}</h3>`+evTiles([["evField",pct(m.fieldAccuracy)],["evDate",pct(m.dateAccuracy)],["evMerchant",pct(m.merchantAccuracy)],["evSubtotal",pct(m.subtotalAccuracy)],["evTax",pct(m.taxAccuracy)],["evTotal",pct(m.totalAccuracy)],["evRate",pct(m.taxRateAccuracy)],["evInvoice",pct(m.invoiceAccuracy)],["evClass",pct(m.classificationAccuracy)]])+
    `<h3 style="margin:0">${esc(t("evChainTitle"))}</h3>`+evTiles([["evDocAcc",pct(m.documentAccuracy)],["evTxAcc",pct(m.transactionAccuracy)],["evJournalAcc",pct(m.journalAccuracy)],["evAccount",pct(m.accountAccuracy)]])+
    `<h3 style="margin:0">${esc(t("evFlowTitle"))}</h3>`+evTiles([["evAuto",pct(m.autoApprovalRate)],["evHuman",pct(m.humanReviewRate)],["evValErr",pct(m.validationErrorRate)],["evDup",pct(m.duplicateDetectionRate)],["evFalseAuto",String(m.falseAutoApprovals.length),m.falseAutoApprovals.length>0]]);
  const ok=b=>b==null?"—":b?`<span class="chip ok">OK</span>`:`<span class="chip no">NG</span>`;
  $("#evTable tbody").innerHTML=evalResult.results.map(r=>{
    const bad=[...Object.entries(r.fields).filter(([,v])=>!v).map(([k])=>k),...Object.entries(r.checks).filter(([,v])=>!v).map(([k])=>k)];
    return `<tr><td class="num">${esc(r.id)}</td><td>${esc(r.title)}</td><td>${ok(r.documentOk)}</td><td>${ok(r.transaction)}</td><td>${ok(r.journal)}</td><td>${r.needsReview?`<span class="chip low">${esc(t("exNeedsReview"))}</span>`:`<span class="chip ok">${esc(t("evAutoShort"))}</span>`}</td><td class="small">${esc(bad.join(", ")||(r.detail.problems||[]).join(", "))}</td></tr>`}).join("");
  renderEvalReal();
}
async function renderEvalReal(){
  const box=$("#evRealBox");
  if(!sb||!uid){box.textContent=t("evNoData");return}
  if(!evalReal){
    box.textContent=t("booksLoading");
    const runs=await sb.from("document_runs").select("id,provider,model,prompt_version,confidence,validation,final,created_at").order("created_at",{ascending:false}).limit(1000);
    if(runs.error){box.textContent=t("evNo003");return}
    const edits=await sb.from("document_field_edits").select("field,run_id").limit(5000);
    evalReal={runs:runs.data||[],edits:edits.error?[]:edits.data||[]};
  }
  const R=evalReal.runs,E=evalReal.edits,n=R.length;
  if(!n){box.textContent=t("evNoData");return}
  const share=f=>pct(100*R.filter(f).length/n);
  const edited=new Set(E.map(e=>e.run_id));
  const byField={};for(const e of E)byField[e.field]=(byField[e.field]||0)+1;
  const prov={};for(const r of R){const k=r.provider+(r.model?" · "+r.model:"");prov[k]=(prov[k]||0)+1}
  box.innerHTML=evTiles([["evRuns",String(n)],["evUnedited",pct(100*(n-R.filter(r=>edited.has(r.id)).length)/n)],["evHuman",share(r=>r.confidence&&r.confidence.needsReview)],
      ["evValErr",share(r=>r.validation&&r.validation.status==="error")],["evDupWarn",share(r=>r.final&&r.final.duplicate)]])+
    `<h3>${esc(t("evCorrections"))}</h3><div class="tablewrap"><table class="jtable"><thead><tr><th>${esc(t("evFieldCol"))}</th><th class="r">${esc(t("evEdits"))}</th><th class="r">${esc(t("evEditRate"))}</th></tr></thead><tbody>${
      Object.entries(byField).sort((a,b)=>b[1]-a[1]).map(([f,c])=>`<tr><td>${esc(f)}</td><td class="r num">${c}</td><td class="r num">${pct(100*c/n)}</td></tr>`).join("")||`<tr><td colspan="3" class="muted">${esc(t("evNoEdits"))}</td></tr>`}</tbody></table></div>`+
    `<h3>${esc(t("evProviders"))}</h3><ul class="why">${Object.entries(prov).map(([k,c])=>`<li>${esc(k)}：${c}</li>`).join("")}</ul>`;
}
// ===== auth & data (Supabase) =====
let signUpMode=false;
function setAuthMode(up){signUpMode=up;$("#aSubmit").dataset.i18n=up?"signUp":"signIn";$("#aToggle").dataset.i18n=up?"haveAcct":"noAcct";
  $("#aPass").autocomplete=up?"new-password":"current-password";applyLang()}
$("#aToggle").onclick=()=>setAuthMode(!signUpMode);
$("#authForm").addEventListener("submit",async e=>{
  e.preventDefault();const msg=$("#aMsg");msg.style.color="";msg.textContent="…";
  const email=$("#aEmail").value.trim(),password=$("#aPass").value;
  const r=signUpMode?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email,password});
  if(r.error){msg.style.color="var(--shu)";msg.textContent=t("authErr")+r.error.message;return}
  if(signUpMode&&!r.data.session){msg.textContent=t("checkEmail");setAuthMode(false);return}
  msg.textContent="";
});
$("#signOut").onclick=async()=>{await sb.auth.signOut()};
$("#sideSignOut").onclick=()=>$("#signOut").click();
async function onSession(session){
  const signedIn=!!session;$("#authView").hidden=signedIn;$("#appView").hidden=!signedIn;
  if(!signedIn){uid=null;entries=[];return}
  if(uid===session.user.id)return;
  uid=session.user.id;
  const {data}=await sb.from("settings").select("data").eq("user_id",uid).maybeSingle();
  if(data&&data.data){settings={...settings,...data.data};
    // one-time: card / e-money receipts default to 未払金 (paid later from the bank); the setting can still be changed
    // one-time: everything is paid personally for now (no business card) → receipts default to 事業主借, cash or card;
    // can be changed later in Settings (現金払いの貸方 / カード・電子マネー払いの貸方)
    if(settings.cardV!==3){settings.card="事業主借";settings.cash="事業主借";settings.cardV=3;persistSettings()}
    let stored=null;try{stored=localStorage.getItem("lang")}catch(e){}
    if(!stored&&data.data.lang&&I18N[data.data.lang])lang=data.data.lang;}
  applyLang();await loadEntries();loadKnowledge();
  if(driveReturn){const r=driveReturn;driveReturn=null;
    if(r.ok){let resume=false;try{resume=sessionStorage.getItem("gdrive_resume")==="1";sessionStorage.removeItem("gdrive_resume")}catch(e){}
      if(resume&&googleCfg){showTab("scan");setTimeout(()=>$("#driveBtn").click(),300)}
      let bk=false;try{bk=sessionStorage.getItem("gdrive_backup")==="1";sessionStorage.removeItem("gdrive_backup")}catch(e){}
      if(bk&&googleCfg){showTab("settings");setTimeout(()=>$("#buDrive").click(),300)}}
    else showDriveError(t({scope:"driveScope",access_denied:"driveDenied"}[r.error]||"driveFail"))}
}
(async()=>{
  try{
    const cfg=await (await fetch("/api/config")).json();
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)throw 0;
    aiEnabled=!!cfg.aiEnabled;
    googleCfg=cfg.googleClientId&&cfg.googleApiKey&&cfg.googleAppId?cfg:null;
    $("#driveBtn").hidden=!googleCfg;
    sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  }catch(e){$("#authView").hidden=false;$("#authForm").hidden=true;$("#aMsg").textContent=t("eCfg");return}
  sb.auth.onAuthStateChange((_ev,session)=>{setTimeout(()=>onSession(session),0)});
  const {data:{session}}=await sb.auth.getSession();onSession(session);
})();
})();
